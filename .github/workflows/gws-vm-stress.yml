name: GWS VM Stress Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - perf/gws-max-async-circleci
    paths:
      - 'tools/gws_vm_benchmark.py'
      - 'tools/gws_async_benchmark.py'
      - 'tools/gws_async_probe.py'
      - '.github/workflows/gws-vm-stress.yml'

permissions:
  contents: read

jobs:
  cpu_threads:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Benchmark real Overture scan with oversubscription
        run: |
          set -euo pipefail
          python tools/gws_vm_benchmark.py --threads 4,8,12,16 --out results/gws_vm_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: gws-vm-thread-benchmark-${{ github.run_id }}
          path: results/gws_vm_benchmark.json
          retention-days: 2

  async_io:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check aiohttp
      - name: Benchmark bounded async website screening
        run: |
          set -euo pipefail
          python tools/gws_async_benchmark.py --concurrency 16,32,64 --sample 24 --out results/gws_async_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: gws-async-benchmark-${{ github.run_id }}
          path: results/gws_async_benchmark.json
          retention-days: 2
