name: Overture Americas Operator-First V5

on:
  push:
    branches: [main]
    paths:
      - 'OVERTURE_AMERICAS_TRIGGER.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: overture-americas-premium
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_rows: ${{ steps.plan.outputs.max_rows }}
      max_web_checks: ${{ steps.plan.outputs.max_web_checks }}
      workers: ${{ steps.plan.outputs.workers }}
      release: ${{ steps.plan.outputs.release }}
      run_name: ${{ steps.plan.outputs.run_name }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('OVERTURE_AMERICAS_TRIGGER.json',encoding='utf-8'))
          print('matrix='+json.dumps({'include':c['shards']},separators=(',',':')))
          print('max_rows='+str(int(c.get('max_rows_per_shard',100000))))
          print('max_web_checks='+str(int(c.get('max_web_checks_per_shard',5000))))
          print('workers='+str(int(c.get('workers',32))))
          print('release='+str(c.get('release','2026-06-17.0')))
          print('run_name='+c.get('run_name','operator-v5'))
          PY

  harvest:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests beautifulsoup4
      - name: Operator-first V5 harvest
        env:
          SHARD_NAME: ${{ matrix.name }}
          COUNTRY: ${{ matrix.country }}
          REGION: ${{ matrix.region }}
          BBOX: ${{ matrix.bbox }}
          MAX_ROWS: ${{ needs.plan.outputs.max_rows }}
          MAX_WEB_CHECKS: ${{ needs.plan.outputs.max_web_checks }}
          WORKERS: ${{ needs.plan.outputs.workers }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -o pipefail
          mkdir -p "results/$SHARD_NAME"
          python tools/overture_operator_first_v5.py --bbox="$BBOX" --country "$COUNTRY" --region "$REGION" --outdir "results/$SHARD_NAME" --release "$RELEASE" --max-rows "$MAX_ROWS" --max-web-checks "$MAX_WEB_CHECKS" --workers "$WORKERS" 2>&1 | tee "results/$SHARD_NAME/v5.log"
      - name: Show V5 summary
        if: always()
        env:
          SHARD_NAME: ${{ matrix.name }}
        run: test ! -f "results/$SHARD_NAME/v5_summary.json" || cat "results/$SHARD_NAME/v5_summary.json"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-v5-${{ needs.plan.outputs.run_name }}-${{ matrix.name }}
          path: |
            results/${{ matrix.name }}/v5_selected_accounts.csv
            results/${{ matrix.name }}/v5_operators.csv
            results/${{ matrix.name }}/v5_properties.csv
            results/${{ matrix.name }}/v5_contactable.csv
            results/${{ matrix.name }}/v5_portfolio_expansion.csv
            results/${{ matrix.name }}/v5_summary.json
            results/${{ matrix.name }}/v5.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
