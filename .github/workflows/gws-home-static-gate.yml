name: GWS Home Static Gate

on:
  push:
    branches: [main]
    paths:
      - 'control/gws_home_static_gate_trigger.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile residential worker and merger
        run: |
          python -m py_compile tools/gws_home_openserp_worker_v55.py tools/gws_home_evidence_merge_v55.py
      - name: Import production stack and verify family policy
        run: |
          python - <<'PY'
          import gws_home_openserp_worker_v55 as h
          import gws_home_evidence_merge_v55 as m
          assert h.FAMILY['google']=='google'
          assert h.FAMILY['bing']=='bing'
          assert h.FAMILY['ecosia']=='bing'
          assert h.FAMILY['duckduckgo']=='duckduckgo'
          assert h.FAMILY['yandex']=='yandex'
          print('GWS_HOME_STATIC_IMPORT_OK')
          PY
      - name: Validate workflow YAML parses as text contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gws-home-residential-certify.yml')
          s=p.read_text()
          for needle in ('self-hosted','gws-home','gws_home_openserp_worker_v55.py','gws_home_evidence_merge_v55.py','single_writer_ingest'):
              assert needle in s, needle
          print('GWS_HOME_WORKFLOW_CONTRACT_OK')
          PY
