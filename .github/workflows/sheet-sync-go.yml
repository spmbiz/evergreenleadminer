name: Sheet Sync Go

on:
  push:
    branches: [main]
    paths:
      - 'control/sheet_sync_go.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute verified materializer embedded in canonical workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cfgp=Path('control/sheet_sync_materialize.json')
          cfg=json.loads(cfgp.read_text(encoding='utf-8'))
          bad='8bc51d53-44c-468f-9b51-d107cd89405e'
          good='8bc51d53-44c4-468f-9b51-d107cd89405e'
          for item in cfg.get('excluded',[]):
              if item.get('id')==bad: item['id']=good
          cfgp.write_text(json.dumps(cfg,separators=(',',':')),encoding='utf-8')
          text=Path('.github/workflows/sheet-sync-materialize.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          code=text.split(marker,1)[1].split("\n          PY",1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          exec(compile(code,'sheet-sync-materializer','exec'),{'__name__':'__main__'})
          PY
      - name: Commit bridge files
        run: |
          set -euo pipefail
          git config user.name 'sheet-sync-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add gpt/sheet_sync_ready/leads.tsv gpt/sheet_sync_ready/dedupe.tsv gpt/sheet_sync_ready/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: materialize verified hospitality sheet sync bridge [skip ci]'
          git checkout -- control/sheet_sync_materialize.json
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*2))
          done
          exit 1
