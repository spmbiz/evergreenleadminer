name: Hospitality Quality Audit Only
on:
  push:
    branches: [agent/hospitality-quality-v2]
    paths: ['.github/workflows/hospitality-quality-audit-only.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test
        run: PYTHONPATH=tools python -m unittest -v tools/test_hospitality_quality_v2.py tools/test_hospitality_intelligence_outreach_gate.py
      - name: Download canonical
        run: |
          mkdir -p audit/db audit/out
          gh release download harvest-state --repo "$GITHUB_REPOSITORY" --pattern hospitality-canonical.sqlite --dir audit/db --clobber
      - name: Audit
        run: PYTHONPATH=tools python tools/hospitality_quality_audit.py --db audit/db/hospitality-canonical.sqlite --outdir audit/out
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-quality-audit-only-${{ github.run_id }}
          path: audit/out/
          retention-days: 3
