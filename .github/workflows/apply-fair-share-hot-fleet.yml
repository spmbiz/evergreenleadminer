name: Apply Fair Share Hot Fleet Patch

on:
  push:
    branches:
      - agent/fair-share-hot-fleet-v4
    paths:
      - control/apply_fair_share_hot_fleet.json

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fair-share-hot-fleet-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply throughput-safe text patches
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          replacements = {
              '.github/workflows/hospitality-autonomous-fleet.yml': [
                  ('python tools/global_capacity_broker.py reserve', 'python tools/global_capacity_broker_v3.py reserve'),
              ],
              '.github/workflows/gws-autonomous-fleet.yml': [
                  ('python tools/global_capacity_broker.py reserve', 'python tools/global_capacity_broker_v3.py reserve'),
              ],
              '.github/workflows/global-broker-canary.yml': [
                  ('python tools/global_capacity_broker.py reserve', 'python tools/global_capacity_broker_v3.py reserve'),
              ],
              'tools/hospitality_multilane_plan.py': [
                  ('EXPLORE_SHARE = 0.15', 'EXPLORE_SHARE = 0.30'),
              ],
          }
          for rel, reps in replacements.items():
              p=Path(rel)
              s=p.read_text(encoding='utf-8')
              for old,new in reps:
                  if old not in s:
                      raise SystemExit(f'missing expected patch anchor in {rel}: {old}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          # Expand the already-production-safe Geofabrik adapter across small,
          # high-value Western markets. The planner HEAD-checks every URL/version;
          # a bad/unavailable source degrades to source_errors and never blocks geo.
          p=Path('config/osm_geofabrik_sources.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg['policy']['source_slot_cap_per_cycle']=2
          existing={x.get('extract_id') for x in cfg.get('extracts',[])}
          additions=[
              ('luxembourg','LU','Luxembourg','https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf',88),
              ('liechtenstein','LI','Liechtenstein','https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf',87),
              ('malta','MT','Malta','https://download.geofabrik.de/europe/malta-latest.osm.pbf',86),
              ('andorra','AD','Andorra','https://download.geofabrik.de/europe/andorra-latest.osm.pbf',85),
              ('iceland','IS','Iceland','https://download.geofabrik.de/europe/iceland-latest.osm.pbf',84),
          ]
          for extract_id,iso2,country,url,priority in additions:
              if extract_id in existing:
                  continue
              cfg['extracts'].append({
                  'extract_id':extract_id,
                  'iso2':iso2,
                  'country':country,
                  'pbf_url':url,
                  'production_enabled':True,
                  'priority':priority,
                  'revisit_hours':168,
                  'max_download_mb':800,
                  'canary':{'mode':'planner_http_version_gate_then_production_small_extract'}
              })
          p.write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Validate Python JSON and workflow YAML
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/global_capacity_broker.py \
            tools/global_capacity_broker_v3.py \
            tools/hospitality_multilane_plan.py \
            tools/hospitality_master_plan.py
          python -m json.tool config/global_fleet.json >/dev/null
          python -m json.tool config/osm_geofabrik_sources.json >/dev/null
          python -m pip install --disable-pip-version-check pyyaml >/dev/null
          python - <<'PY'
          import yaml
          from pathlib import Path
          for rel in [
              '.github/workflows/hospitality-autonomous-fleet.yml',
              '.github/workflows/gws-autonomous-fleet.yml',
              '.github/workflows/global-broker-canary.yml',
              '.github/workflows/hospitality-continuous-controller.yml',
              '.github/workflows/autonomous-fleet-continuation.yml',
          ]:
              yaml.safe_load(Path(rel).read_text(encoding='utf-8'))
              print('yaml_ok',rel)
          PY

      - name: Commit validated patch to branch
        run: |
          set -euo pipefail
          git config user.name "ai-prod-fleet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/hospitality-autonomous-fleet.yml \
            .github/workflows/gws-autonomous-fleet.yml \
            .github/workflows/global-broker-canary.yml \
            tools/hospitality_multilane_plan.py \
            config/osm_geofabrik_sources.json
          if git diff --cached --quiet; then
            echo "Patch already represented"
            exit 0
          fi
          git commit -m "fleet: hot-loop fair-share throughput patch"
          git push origin HEAD:agent/fair-share-hot-fleet-v4
