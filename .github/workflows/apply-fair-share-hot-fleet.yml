name: Validate Fair Share Hot Fleet

on:
  push:
    branches:
      - agent/fair-share-hot-fleet-v4
    paths:
      - control/apply_fair_share_hot_fleet.json

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fair-share-hot-fleet-v4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate code and configuration
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/global_capacity_broker.py \
            tools/global_capacity_broker_v3.py \
            tools/hospitality_multilane_plan.py \
            tools/hospitality_master_plan.py \
            tools/hospitality_fleet_aggregate.py
          python -m json.tool config/global_fleet.json >/dev/null
          python -m json.tool config/osm_geofabrik_sources.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          fleet=json.load(open('config/global_fleet.json'))
          assert fleet['github']['preemption_policy']=='natural_completion_only'
          assert fleet['github']['idle_capacity_policy']=='borrow_immediately'
          assert abs(float(fleet['workloads']['hospitality']['weight'])-.50)<1e-9
          assert abs(float(fleet['workloads']['gws']['weight'])-.25)<1e-9
          assert abs(float(fleet['workloads']['tenders']['weight'])-.25)<1e-9
          src=Path('tools/hospitality_multilane_plan.py').read_text()
          assert 'EXPLORE_SHARE = 0.30' in src
          osm=json.load(open('config/osm_geofabrik_sources.json'))
          ids={x['extract_id'] for x in osm['extracts'] if x.get('production_enabled')}
          assert {'monaco','luxembourg','liechtenstein','malta','andorra','iceland'} <= ids
          assert int(osm['policy']['source_slot_cap_per_cycle'])==2
          print('static_policy_ok', sorted(ids))
          PY

      - name: Live broker dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/broker
          python tools/global_capacity_broker.py reserve \
            --workload hospitality \
            --requested 20 \
            --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/broker/hospitality.json \
            --dry-run
          python tools/global_capacity_broker.py reserve \
            --workload gws \
            --requested 10 \
            --run-id "$RUN_ID-gws" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out /tmp/broker/gws.json \
            --dry-run
          python - <<'PY'
          import json
          for workload in ('hospitality','gws'):
              b=json.load(open(f'/tmp/broker/{workload}.json'))
              assert b.get('broker_version')==3, b
              assert sum(int(v) for v in (b.get('fair_targets') or {}).values()) <= int(b['capacity'])
              assert int(b['allocated']) >= 0
              assert int(b['allocated']) + int(b['external_slots']) + int(b['leased_other_slots']) + int(b['sibling_headroom']) <= int(b['capacity'])
              print(workload, json.dumps({
                  'allocated':b['allocated'],
                  'active_by_workload':b.get('active_by_workload'),
                  'fair_targets':b.get('fair_targets'),
                  'sibling_headroom':b.get('sibling_headroom'),
              }))
          PY
