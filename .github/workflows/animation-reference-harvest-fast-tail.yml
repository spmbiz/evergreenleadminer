name: Fast tail harvest groups 3 and 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-tail:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install requests beautifulsoup4 pillow imagehash numpy opencv-python-headless yt-dlp
      - run: python tools/harvest40.py --group ${{ matrix.group }} --output output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tail-group-${{ matrix.group }}
          path: output/
