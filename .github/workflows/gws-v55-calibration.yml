name: GWS v5.5 Calibration

on:
  push:
    branches: [main]
    paths:
      - 'control/gws_v55_calibration_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  resolution-census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEGACY_EXPECTED: '5047'
      SNAPSHOT_DIR: data/gws/legacy_deep/source_snapshot_5047_v5
      SNAPSHOT_MANIFEST: data/gws/legacy_deep/source_snapshot_5047_v5/manifest_shards.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage exact snapshot
        run: |
          set -euo pipefail
          python tools/gws_legacy_shard_guard.py \
            --source-dir "$SNAPSHOT_DIR" \
            --manifest "$SNAPSHOT_MANIFEST" \
            --outdir source_queue \
            --expected "$LEGACY_EXPECTED"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb aiohttp
      - name: Census strict-HIGH-eligible identities
        run: |
          set -euo pipefail
          mkdir -p calibration
          python tools/gws_resolution_census_v55.py \
            --queue source_queue \
            --expected "$LEGACY_EXPECTED" \
            --threads 12 \
            --out calibration/census.json
      - uses: actions/upload-artifact@v4
        with:
          name: gws-v55-census-${{ github.run_id }}
          path: calibration/
          retention-days: 3

  provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe independent public search surfaces from GitHub egress
        run: |
          python - <<'PY'
          import asyncio, json, re, time, urllib.parse
          import urllib.request

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          cases=[
            ('KANOFF LEGAL Brussels','kanofflegal.com'),
            ('ID.CITE ARCHITECTS Bruxelles','idcite.be'),
          ]
          providers={
            'brave_html': lambda q:'https://search.brave.com/search?q='+urllib.parse.quote_plus(q)+'&source=web',
            'mojeek_html': lambda q:'https://www.mojeek.com/search?q='+urllib.parse.quote_plus(q),
            'google_html': lambda q:'https://www.google.com/search?hl=fr&gl=be&num=10&filter=0&q='+urllib.parse.quote_plus(q),
            'qwant_html': lambda q:'https://www.qwant.com/?t=web&q='+urllib.parse.quote_plus(q),
            'startpage_html': lambda q:'https://www.startpage.com/sp/search?query='+urllib.parse.quote_plus(q),
            'ecosia_html': lambda q:'https://www.ecosia.org/search?q='+urllib.parse.quote_plus(q),
            'swisscows_html': lambda q:'https://swisscows.com/en/web?query='+urllib.parse.quote_plus(q),
            'yep_html': lambda q:'https://yep.com/web?q='+urllib.parse.quote_plus(q),
            'jina_brave_reader': lambda q:'https://r.jina.ai/https://search.brave.com/search?q='+urllib.parse.quote_plus(q),
            'jina_mojeek_reader': lambda q:'https://r.jina.ai/https://www.mojeek.com/search?q='+urllib.parse.quote_plus(q),
          }
          def one(name, url, expected):
            z=time.time(); out={'provider':name,'url':url,'expected':expected}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'fr-BE,fr;q=0.9,en;q=0.8'})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read(1200000).decode(errors='ignore')
                out.update(status=int(r.status), final_url=str(r.url), bytes=len(body), elapsed=round(time.time()-z,3), expected_domain_present=expected.lower() in body.lower())
                low=body.lower()
                out['blocked_marker']=any(x in low for x in ('captcha','verify you are human','unusual traffic','access denied','forbidden'))
                out['absolute_http_links']=len(re.findall(r'https?://[^\\s\"<>]+',body))
            except Exception as e:
              out.update(status=0,elapsed=round(time.time()-z,3),error=type(e).__name__+':'+str(e)[:180],expected_domain_present=False)
            return out
          results=[]
          for q,expected in cases:
            for name,build in providers.items():
              results.append(one(name,build(q),expected))
          summary={}
          for r in results:
            s=summary.setdefault(r['provider'],{'attempts':0,'http_2xx':0,'expected_hits':0,'blocked':0,'latencies':[]})
            s['attempts']+=1;s['http_2xx']+=200<=int(r.get('status') or 0)<300;s['expected_hits']+=bool(r.get('expected_domain_present'));s['blocked']+=bool(r.get('blocked_marker'));s['latencies'].append(r.get('elapsed'))
          open('provider_probe.json','w').write(json.dumps({'results':results,'summary':summary},indent=2)+'\n')
          print('GWS_V55_PROVIDER_PROBE='+json.dumps(summary,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gws-v55-provider-probe-${{ github.run_id }}
          path: provider_probe.json
          retention-days: 3
