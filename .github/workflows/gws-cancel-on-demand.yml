name: GWS Cancel On Demand

on:
  push:
    branches: [main]
    paths:
      - 'control/gws_cancel_run.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Cancel requested workflow runs and release their broker leases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/gws_cancel_ids.txt
          import json
          x=json.load(open('control/gws_cancel_run.json'))
          ids=x.get('run_ids')
          if ids is None:
              ids=[x.get('run_id')]
          for rid in ids:
              if rid:
                  print(int(rid))
          PY
          while read -r target; do
            [ -n "$target" ] || continue
            echo "Cancelling run $target"
            set +e
            out=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${target}/cancel" 2>&1)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "CANCEL_REQUESTED=$target"
            else
              echo "CANCEL_NONFATAL=$target $out"
            fi

            set +e
            release_out=$(python tools/global_capacity_broker.py release --run-id "$target" --repo "$GITHUB_REPOSITORY" 2>&1)
            release_code=$?
            set -e
            if [ "$release_code" -eq 0 ]; then
              echo "LEASE_RELEASED_OR_ABSENT=$target $release_out"
            else
              echo "LEASE_RELEASE_FAILED=$target $release_out" >&2
              exit "$release_code"
            fi
          done < /tmp/gws_cancel_ids.txt
