name: GWS v5.5 Zero-Spend Shortlist Screen

on:
  push:
    branches: [main]
    paths:
      - 'control/gws_v55_shortlist_screen_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEGACY_EXPECTED: '5047'
      SNAPSHOT_DIR: data/gws/legacy_deep/source_snapshot_5047_v5
      SNAPSHOT_MANIFEST: data/gws/legacy_deep/source_snapshot_5047_v5/manifest_shards.json
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb aiohttp
      - name: Regression gate
        run: python tools/gws_v5_selftest.py
      - name: Stage exact immutable snapshot
        run: |
          set -euo pipefail
          python tools/gws_legacy_shard_guard.py \
            --source-dir "$SNAPSHOT_DIR" \
            --manifest "$SNAPSHOT_MANIFEST" \
            --outdir source_queue \
            --expected "$LEGACY_EXPECTED"
      - name: Screen strict identity candidates without independent paid index
        run: |
          set -euo pipefail
          mkdir -p screen_out
          python tools/gws_strict_shortlist_screen_v55.py \
            --queue source_queue \
            --expected "$LEGACY_EXPECTED" \
            --outdir screen_out \
            --threads 12 \
            --http-concurrency 32 \
            --search-concurrency 4 \
            --batch-size 24
      - name: Assert screen integrity
        run: |
          python - <<'PY'
          import json
          s=json.load(open('screen_out/summary.json'))
          assert int(s.get('strict_identity_candidates',-1)) > 0, s
          assert int(s.get('strict_identity_candidates',0)) == int(s.get('owned_site_rejects',0)) + int(s.get('independent_certification_survivors',0)), s
          assert int(s.get('final_high',-1)) == 0, s
          print('GWS_V55_SHORTLIST_SCREEN_INTEGRITY_OK')
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-v55-shortlist-screen-${{ github.run_id }}
          path: screen_out/
          if-no-files-found: warn
          retention-days: 4
