name: Fleet Release Refill

on:
  repository_dispatch:
    types: [fleet_refill]
  workflow_dispatch:
    inputs:
      workload:
        description: 'hospitality or gws'
        required: true
        type: choice
        options:
          - hospitality
          - gws
      source_run_id:
        description: 'Optional run id to exclude while it finishes its release job'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: fleet-release-refill-${{ github.event.client_payload.workload || inputs.workload || 'unknown' }}
  cancel-in-progress: false

jobs:
  dispatch_next:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Dispatch next fleet run when no successor already exists
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_WORKLOAD: ${{ github.event.client_payload.workload || inputs.workload }}
          PAYLOAD_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$PAYLOAD_WORKLOAD" in
            hospitality) workflow_file="hospitality-autonomous-fleet.yml" ;;
            gws) workflow_file="gws-autonomous-fleet.yml" ;;
            *) echo "Unknown workload: $PAYLOAD_WORKLOAD" >&2; exit 1 ;;
          esac

          source_id="${PAYLOAD_SOURCE_RUN_ID:-}"
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?per_page=30" \
            --jq --arg source "$source_id" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and ((.id|tostring) != $source))] | length')

          if [ "$active" -gt 0 ]; then
            echo "$PAYLOAD_WORKLOAD already has successor/parallel run(s): $active; no duplicate dispatch."
            exit 0
          fi

          if [ "$PAYLOAD_WORKLOAD" = "hospitality" ]; then
            printf '%s\n' '{"ref":"main","inputs":{"force_workers":"0"}}' | \
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
                --input -
          else
            printf '%s\n' '{"ref":"main"}' | \
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
                --input -
          fi
          echo "release-driven refill dispatched workload=$PAYLOAD_WORKLOAD source_run_id=$source_id"
