name: Fleet Release Refill

on:
  repository_dispatch:
    types: [fleet_refill]
  workflow_dispatch:
    inputs:
      workload:
        description: 'hospitality or gws'
        required: true
        type: choice
        options:
          - hospitality
          - gws
      source_run_id:
        description: 'Optional run id to exclude while it finishes its release job'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: fleet-release-refill-${{ github.event.client_payload.workload || inputs.workload || 'unknown' }}
  cancel-in-progress: false

jobs:
  dispatch_next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next fleet run when no successor already exists
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_WORKLOAD: ${{ github.event.client_payload.workload || inputs.workload }}
          PAYLOAD_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$PAYLOAD_WORKLOAD" in
            hospitality) workflow_file="hospitality-autonomous-fleet.yml" ;;
            # GWS downstream truth is the strict verifier. Semantic completion
            # must feed strict, and a zero-capacity strict run must retry strict.
            # The generic autonomous discovery lane must not steal that wakeup.
            gws) workflow_file="gws-pending-search-verify.yml" ;;
            *) echo "Unknown workload: $PAYLOAD_WORKLOAD" >&2; exit 1 ;;
          esac

          source_id="${PAYLOAD_SOURCE_RUN_ID:-}"
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?per_page=30" \
            --jq "[.workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and ((.id|tostring) != \"${source_id}\"))] | length")

          if [ "$active" -gt 0 ]; then
            echo "$PAYLOAD_WORKLOAD already has successor/parallel run(s): $active; no duplicate dispatch."
            exit 0
          fi

          if [ "$PAYLOAD_WORKLOAD" = "hospitality" ]; then
            printf '%s\n' '{"ref":"main","inputs":{"force_workers":"0"}}' | \
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
                --input -
          else
            printf '%s\n' '{"ref":"main"}' | \
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
                --input -
          fi
          echo "release-driven refill dispatched workload=$PAYLOAD_WORKLOAD workflow=$workflow_file source_run_id=$source_id"

      - name: Refresh full Sheet-sync staging when Hospitality bridge is stale
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_WORKLOAD: ${{ github.event.client_payload.workload || inputs.workload }}
        run: |
          set -euo pipefail
          [ "$PAYLOAD_WORKLOAD" = "hospitality" ] || { echo "Not hospitality; no Sheet staging refresh needed."; exit 0; }

          export_workflow="export-sheet-sync-queue.yml"
          now=$(date -u +%s)
          latest_created=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$export_workflow/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$latest_created" ]; then
            latest_epoch=$(date -u -d "$latest_created" +%s)
            age=$((now - latest_epoch))
          else
            age=999999
          fi
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$export_workflow/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')

          if [ "$active" -gt 0 ]; then
            echo "Sheet staging export already active/queued=$active"
            exit 0
          fi
          if [ "$age" -lt 600 ]; then
            echo "Sheet staging fresh age_seconds=$age"
            exit 0
          fi

          printf '%s\n' '{"ref":"main"}' | \
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$export_workflow/dispatches" \
              --input -
          echo "Sheet staging refresh dispatched; previous age_seconds=$age"
