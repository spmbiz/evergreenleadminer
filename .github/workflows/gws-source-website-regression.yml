name: GWS Source Website P0 Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/gws_search_verify_source_safe.py'
      - 'tools/gws_ownership_gate.py'
      - 'tools/gws_pending_verify_worker.py'
      - 'tools/test_gws_source_website_regression.py'
      - '.github/workflows/gws-source-website-regression.yml'
      - '.github/workflows/gws-autonomous-fleet.yml'
      - '.github/workflows/gws-pending-search-verify.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run P0 source-website regression suite
        env:
          PYTHONPATH: tools
        run: python tools/test_gws_source_website_regression.py
      - name: Assert both strict production paths use source-safe verifier
        run: |
          set -euo pipefail
          grep -q 'python tools/gws_search_verify_source_safe.py' .github/workflows/gws-autonomous-fleet.yml
          grep -q 'python tools/gws_search_verify_source_safe.py' .github/workflows/gws-pending-search-verify.yml
          if grep -q 'python tools/gws_search_verify_ownership_safe.py' .github/workflows/gws-autonomous-fleet.yml; then exit 1; fi
          if grep -q 'python tools/gws_search_verify_ownership_safe.py' .github/workflows/gws-pending-search-verify.yml; then exit 1; fi
          echo 'SOURCE_SAFE_WIRING_OK=1'
