name: AllThePlaces Range Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/atp_probe.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atp-range-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests fsspec
      - run: |
          mkdir -p probe
          python tools/atp_remote_zip_probe.py --out probe/atp_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: atp-range-probe-${{ github.run_id }}
          path: probe/
          retention-days: 2
