name: AllThePlaces Hospitality Spider Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/atp_probe.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atp-hospitality-spider-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests ijson
      - run: |
          mkdir -p probe
          python tools/atp_api_probe.py --out probe/atp_api_probe.json
          python tools/atp_spider_probe.py \
            --spiders lhw,wanderhotels,fairmont,jumeirah,minor_hotels \
            --sample 5 \
            --out probe/atp_spider_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atp-hospitality-spider-probe-${{ github.run_id }}
          path: probe/
          if-no-files-found: warn
          retention-days: 2
