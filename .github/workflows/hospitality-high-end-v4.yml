name: Hospitality High-End First V4

on:
  push:
    branches: [main]
    paths:
      - 'HIGH_END_V4_TRIGGER.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hospitality-high-end-v4
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_candidates: ${{ steps.plan.outputs.max_candidates }}
      max_screen: ${{ steps.plan.outputs.max_screen }}
      workers: ${{ steps.plan.outputs.workers }}
      run_name: ${{ steps.plan.outputs.run_name }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg=json.load(open('HIGH_END_V4_TRIGGER.json',encoding='utf-8'))
          shards=cfg.get('shards') or []
          if not shards: raise SystemExit('No V4 shards configured')
          seen=set(); uniq=[]
          for x in shards:
              if x['name'] in seen: continue
              seen.add(x['name']); uniq.append(x)
          print('matrix='+json.dumps({'include':uniq},separators=(',',':')))
          print('max_candidates='+str(int(cfg.get('max_candidates_per_shard',30000))))
          print('max_screen='+str(int(cfg.get('max_screen_per_shard',12000))))
          print('workers='+str(int(cfg.get('workers',36))))
          print('run_name='+str(cfg.get('run_name','high-end-v4')))
          PY

  harvest:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download Geofabrik shard
        env:
          PBF_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --speed-time 60 --speed-limit 1024 -o work/input.osm.pbf "$PBF_URL"
      - name: High-end-first V4 harvest
        env:
          COUNTRY: ${{ matrix.country }}
          REGION: ${{ matrix.region }}
          SHARD_NAME: ${{ matrix.name }}
          MAX_CANDIDATES: ${{ needs.plan.outputs.max_candidates }}
          MAX_SCREEN: ${{ needs.plan.outputs.max_screen }}
          WORKERS: ${{ needs.plan.outputs.workers }}
        run: |
          set -o pipefail
          mkdir -p "results/$SHARD_NAME"
          python tools/osm_high_end_first_v41.py \
            --pbf work/input.osm.pbf \
            --outdir "results/$SHARD_NAME" \
            --country "$COUNTRY" \
            --region "$REGION" \
            --max-candidates "$MAX_CANDIDATES" \
            --max-screen "$MAX_SCREEN" \
            --workers "$WORKERS" \
            2>&1 | tee "results/$SHARD_NAME/v4.log"
      - name: Show V4 summary
        if: always()
        env:
          SHARD_NAME: ${{ matrix.name }}
        run: |
          test ! -f "results/$SHARD_NAME/v4_summary.json" || cat "results/$SHARD_NAME/v4_summary.json"
      - name: Upload V4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highend-v4-${{ needs.plan.outputs.run_name }}-${{ matrix.name }}
          path: |
            results/${{ matrix.name }}/v4_raw_broad.csv
            results/${{ matrix.name }}/v4_scored_screen_pool.csv
            results/${{ matrix.name }}/v4_selected.csv
            results/${{ matrix.name }}/v4_selected_with_email.csv
            results/${{ matrix.name }}/v4_master_ready.csv
            results/${{ matrix.name }}/v4_rejected_after_screen.csv
            results/${{ matrix.name }}/v4_summary.json
            results/${{ matrix.name }}/v4.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
