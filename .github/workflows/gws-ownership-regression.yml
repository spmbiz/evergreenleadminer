name: GWS Ownership Recall Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/gws_ownership_gate.py'
      - 'tools/gws_search_verify_ownership_safe.py'
      - 'tools/gws_home_openserp_worker_ownership_safe.py'
      - 'tools/gws_fleet_preaggregate_ownership_guard.py'
      - 'tools/gws_pending_verify_plan.py'
      - 'tools/test_gws_ownership_regression.py'
      - '.github/workflows/gws-autonomous-fleet.yml'
      - '.github/workflows/gws-home-pending-residential.yml'
      - '.github/workflows/gws-ownership-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ownership recall regression suite
        env:
          PYTHONPATH: tools
        run: python tools/test_gws_ownership_regression.py
      - name: Assert live recovery backlog is actually prioritized
        env:
          PYTHONPATH: tools
        run: |
          python tools/gws_pending_verify_plan.py --outdir results/gws_ownership_plan_assert --max-workers 1 --per-worker 12
          python - <<'PY'
          import json
          p=json.load(open('results/gws_ownership_plan_assert/plan.json',encoding='utf-8'))
          print('OWNERSHIP_RECALL_PLAN_ASSERT='+json.dumps({
              'eligible':p.get('eligible'),
              'selected':p.get('selected'),
              'ownership_recall_eligible':p.get('ownership_recall_eligible'),
              'ownership_recall_selected':p.get('ownership_recall_selected'),
              'suppressed_terminal':p.get('suppressed_terminal'),
          },separators=(',',':')))
          if int(p.get('ownership_recall_eligible') or 0) <= 0:
              raise SystemExit('Expected ownership recall rows to be eligible')
          if int(p.get('ownership_recall_selected') or 0) <= 0:
              raise SystemExit('Ownership recall rows exist but planner did not select any')
          PY
