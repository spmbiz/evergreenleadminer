name: Shared 60 Worker Pool Migration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/shared-pool-migrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Convert fleet to 20/20/20 elastic shared pool
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          fleet_path=Path('config/global_fleet.json')
          fleet=json.loads(fleet_path.read_text(encoding='utf-8'))
          fleet['github']['capacity']=60
          for name in ('hospitality','gws','tenders'):
              cfg=fleet['workloads'][name]
              cfg['weight']=1/3
              cfg['min_slots_when_demanding']=20
              cfg['max_slots']=60
          fleet['github']['idle_capacity_policy']='borrow_immediately'
          fleet['github']['preemption_policy']='natural_completion_only'
          fleet_path.write_text(json.dumps(fleet,indent=2)+'\n',encoding='utf-8')

          # Repos transferred to SPMBiz: operational coordinates must no longer
          # rely on GitHub redirects. runnerlocal intentionally stays personal.
          roots=[Path('tools'),Path('config'),Path('.github/workflows')]
          suffixes={'.py','.json','.yml','.yaml','.sh','.ps1','.md'}
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.name=='shared-pool-migrate.yml' or p.suffix.lower() not in suffixes: continue
                  try: old=p.read_text(encoding='utf-8')
                  except Exception: continue
                  new=(old.replace('walidgdg1-ai/tender-engine','spmbiz/tender-engine')
                          .replace('walidgdg1-ai/evergreenleadminer','spmbiz/evergreenleadminer'))
                  if p.name in {'global_capacity_broker.py','global_capacity_broker_v3.py','global_capacity_broker_v4.py'}:
                      new=new.replace('default="walidgdg1-ai"','default="spmbiz"')
                      new=new.replace("default='walidgdg1-ai'","default='spmbiz'")
                  if new!=old:
                      p.write_text(new,encoding='utf-8')
                      print('UPDATED',p)
          PY
      - name: Validate shared-pool invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('config/global_fleet.json').read_text())
          assert f['github']['capacity']==60
          for name in ('hospitality','gws','tenders'):
              x=f['workloads'][name]
              assert x['min_slots_when_demanding']==20,(name,x)
              assert x['max_slots']==60,(name,x)
              assert abs(float(x['weight'])-(1/3)) < 1e-9,(name,x)
          assert f['workloads']['tenders']['repo']=='spmbiz/tender-engine'
          assert 'walidgdg1-ai/runnerlocal' in Path('config/gws_search_verify.json').read_text(encoding='utf-8')
          for rel in ['tools/global_capacity_broker.py','tools/global_capacity_broker_v3.py']:
              s=Path(rel).read_text(encoding='utf-8')
              assert 'spmbiz/tender-engine' in s
          print('SHARED_POOL_EVERGREEN_VALIDATION=PASS')
          PY
          python -m py_compile tools/global_capacity_broker.py tools/global_capacity_broker_v3.py
          git diff --check
      - name: Persist migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'spmbiz-shared-pool'
          git config user.email 'actions@users.noreply.github.com'
          git add config tools .github/workflows
          git reset .github/workflows/shared-pool-migrate.yml
          if git diff --cached --quiet; then echo 'NO_DELTA=1'; exit 0; fi
          git commit -m '[fleet] make 60 workers a 20/20/20 elastic shared pool [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
