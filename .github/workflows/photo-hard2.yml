name: Photo Hard 2 Candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hard2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: photo-harvest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: photo-harvest/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect candidates
        run: python hard2_harvest.py 2>&1 | tee hard2.log
      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: people-photos-hard2-candidates
          path: |
            photo-harvest/people-photos-hard2-candidates.zip
            photo-harvest/people-photos-hard2-candidates/manifest.csv
            photo-harvest/people-photos-hard2-candidates/README.txt
            photo-harvest/hard2.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
