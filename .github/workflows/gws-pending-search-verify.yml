name: GWS Pending Search Verify Fleet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [gws_verify_refill]
  push:
    branches: [main]
    paths:
      - 'control/gws_strict_kick.json'
      - '.github/workflows/gws-pending-search-verify.yml'
      - 'tools/gws_compound_semantic.py'
      - 'tools/gws_compound_semantic_aggregate.py'
      - 'config/gws_semantic_v1.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: gws-pending-search-verify-fleet
  cancel-in-progress: false

jobs:
  plan:
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      workers: ${{ steps.plan.outputs.workers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      allocated: ${{ steps.reserve.outputs.allocated }}
      plan_sha: ${{ steps.state.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: state
        name: Refresh latest durable GWS state before planning
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Planning from durable main SHA $(git rev-parse HEAD)"
      - name: Preview useful pending-verification demand
        run: python tools/gws_pending_verify_plan.py --outdir results/gws_verify_preplan --max-workers 20 --per-worker 70
      - id: reserve
        name: Reserve fair-share global GWS capacity
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED=$(python -c 'import json; print(int(json.load(open("results/gws_verify_preplan/plan.json")).get("workers") or 0))')
          if [ "$REQUESTED" -le 0 ]; then
            mkdir -p results/gws_verify_preplan
            echo '{"allocated":0}' > results/gws_verify_preplan/broker.json
            echo 'allocated=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/global_capacity_broker.py reserve \
            --workload gws \
            --requested "$REQUESTED" \
            --demand-override "$REQUESTED" \
            --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out results/gws_verify_preplan/broker.json
          ALLOCATED=$(python -c 'import json; print(int(json.load(open("results/gws_verify_preplan/broker.json")).get("allocated") or 0))')
          echo "allocated=$ALLOCATED" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Build final verification matrix from brokered capacity
        env:
          ALLOCATED: ${{ steps.reserve.outputs.allocated }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/gws_pending_verify_plan.py \
            --outdir results/gws_verify_plan \
            --max-workers "${ALLOCATED:-0}" \
            --per-worker 70
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.workers != '0'
        with:
          name: gws-pending-verify-plan-${{ github.run_id }}
          path: results/gws_verify_plan/
          retention-days: 1
          compression-level: 6

  verify:
    needs: plan
    if: needs.plan.outputs.workers != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.workers) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.plan_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier and sidecar dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests 'ddgs>=9,<10' aiohttp 'huggingface_hub>=0.34,<2'
      - uses: actions/download-artifact@v4
        with:
          name: gws-pending-verify-plan-${{ github.run_id }}
          path: results/gws_verify_plan
      - name: Start hosted OpenSERP or arm fallback
        id: openserp
        shell: bash
        run: |
          set +e
          if bash tools/start_openserp_ci.sh; then
            echo 'url=http://127.0.0.1:7000' >> "$GITHUB_OUTPUT"
            echo 'mode=openserp_ci' >> "$GITHUB_OUTPUT"
          else
            echo 'url=' >> "$GITHUB_OUTPUT"
            echo 'mode=fallback_search_fabric' >> "$GITHUB_OUTPUT"
            echo 'OpenSERP unavailable; continuing exclusion-only through fallback providers.'
          fi
          exit 0
      - name: Refresh current identity and verify pending partition
        env:
          OPENSERP_URL: ${{ steps.openserp.outputs.url }}
        run: |
          out="results/gws_verify_shards/${{ matrix.worker_index }}"
          python tools/gws_pending_verify_worker.py \
            --input results/gws_verify_plan/pending.jsonl \
            --worker-index ${{ matrix.worker_index }} \
            --worker-count ${{ matrix.worker_count }} \
            --outdir "$out" \
            --threads 8
          python tools/gws_search_verify_source_safe.py --shard-dir "$out" --config config/gws_search_verify.json

      - id: semantic
        name: Select fresh ambiguous rows for same-runner Qwen sidecar
        shell: bash
        run: |
          out="results/gws_verify_shards/${{ matrix.worker_index }}"
          python tools/gws_compound_semantic.py \
            --shard-dir "$out" \
            --outdir "$out/compound_semantic" \
            --config config/gws_semantic_v1.json \
            --worker-index "${{ matrix.worker_index }}"

      - id: semantic_model
        name: Read pinned Qwen sidecar config
        if: steps.semantic.outputs.selected != '0'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('config/gws_semantic_v1.json'))['qwen']
          print('repo='+q['model_repo'])
          print('revision='+q['model_revision'])
          print('file='+q['model_file'])
          print('image='+q['llama_cpp_image'])
          PY

      - name: Restore Qwen model cache on same GWS worker
        if: steps.semantic.outputs.selected != '0'
        uses: actions/cache@v4
        id: semantic_model_cache
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ steps.semantic_model.outputs.revision }}

      - name: Recover pinned Qwen model if cache is cold
        if: steps.semantic.outputs.selected != '0' && steps.semantic_model_cache.outputs.cache-hit != 'true'
        env:
          MODEL_REPO: ${{ steps.semantic_model.outputs.repo }}
          MODEL_REVISION: ${{ steps.semantic_model.outputs.revision }}
          MODEL_FILE: ${{ steps.semantic_model.outputs.file }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model_cache
          python -c "import os; from huggingface_hub import hf_hub_download; hf_hub_download(repo_id=os.environ['MODEL_REPO'], filename=os.environ['MODEL_FILE'], revision=os.environ['MODEL_REVISION'], local_dir='model_cache')"
          test -s "model_cache/$MODEL_FILE"

      - name: Start Qwen sidecar fail-open on same GWS worker
        if: steps.semantic.outputs.selected != '0'
        env:
          MODEL_FILE: ${{ steps.semantic_model.outputs.file }}
          LLAMA_CPP_IMAGE: ${{ steps.semantic_model.outputs.image }}
        shell: bash
        run: |
          set +e
          if [ -s "model_cache/$MODEL_FILE" ] && bash tools/start_qwen4b_ci.sh "$PWD/model_cache" "$MODEL_FILE"; then
            echo 'QWEN_URL=http://127.0.0.1:8080' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=ready_compound_gws' >> "$GITHUB_ENV"
          else
            echo 'QWEN_URL=http://127.0.0.1:65534' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=unavailable_fail_open' >> "$GITHUB_ENV"
            echo 'GWS compound Qwen unavailable; strict verification remains valid and semantic stays retryable.'
          fi
          exit 0

      - name: Run semantic shadow on the already allocated GWS worker
        if: steps.semantic.outputs.selected != '0'
        env:
          OPENSERP_URL: ${{ steps.openserp.outputs.url }}
        shell: bash
        run: |
          out="results/gws_verify_shards/${{ matrix.worker_index }}"
          python tools/gws_semantic_worker.py \
            --input "$out/compound_semantic/selected.jsonl" \
            --config config/gws_semantic_v1.json \
            --qwen-url "$QWEN_URL" \
            --worker-index "${{ matrix.worker_index }}" \
            --outdir "$out/compound_semantic/worker"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-pending-verify-shard-${{ matrix.worker_index }}
          path: results/gws_verify_shards/${{ matrix.worker_index }}/
          retention-days: 1
          compression-level: 6

  aggregate:
    needs: [plan, verify]
    if: always() && needs.plan.outputs.workers != '0'
    concurrency:
      group: gws-semantic-ledger-writer
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh durable state base
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: gws-pending-verify-shard-*
          path: results/gws_verify_shards
      - name: Aggregate strict verification results
        run: python tools/gws_pending_verify_aggregate.py --root results/gws_verify_shards
      - name: Persist same-runner Qwen shadow outputs without changing strict truth
        run: python tools/gws_compound_semantic_aggregate.py --root results/gws_verify_shards --config config/gws_semantic_v1.json
      - name: Persist verification ledger, semantic sidecar and handoff
        run: |
          set -euo pipefail
          git config user.name 'evergreen-gws-verify'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            state/gws_verify_index.json \
            state/gws_semantic_index.json \
            gpt/gws_pending_batches.json \
            gpt/gws_verified_pending.json \
            gpt/gws_verified_review/ \
            gpt/gws_semantic_hard_review/ \
            data/gws/verification/ \
            metrics/gws_verify_latest.json \
            metrics/gws_verify_history.jsonl
          for p in data/gws/semantic gpt/gws_semantic_review metrics/gws_compound_semantic_latest.json metrics/gws_compound_semantic_history.jsonl; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo 'No GWS verification/semantic delta.'
          else
            git commit -m "[gws-verify-state] strict + same-runner Qwen ${GITHUB_RUN_ID} [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort >/dev/null 2>&1 || true
                echo 'Concurrent verification-state conflict; refusing unsafe merge.' >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
            test "$pushed" = 1
          fi

  release_capacity:
    needs: [plan, verify, aggregate]
    if: always()
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Release global GWS capacity lease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python tools/global_capacity_broker.py release --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY"
