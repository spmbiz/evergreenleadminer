name: GWS Pending Search Verify Fleet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [gws_verify_refill]
  push:
    branches: [main]
    paths:
      - 'control/gws_strict_kick.json'
      - '.github/workflows/gws-pending-search-verify.yml'
      - 'tools/gws_compound_semantic.py'
      - 'tools/gws_compound_semantic_aggregate.py'
      - 'config/gws_semantic_v1.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: gws-pending-search-verify-fleet
  # A code push supersedes stale architecture runs; scheduled/refill passes stay serialized.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      workers: ${{ steps.plan.outputs.workers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      allocated: ${{ steps.reserve.outputs.allocated }}
      plan_sha: ${{ steps.state.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: state
        name: Refresh latest durable GWS state before planning
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Planning from durable main SHA $(git rev-parse HEAD)"
      - name: Preview useful pending-verification demand
        run: python tools/gws_pending_verify_plan.py --outdir results/gws_verify_preplan --max-workers 20 --per-worker 15
      - id: reserve
        name: Reserve fair-share global GWS capacity
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED=$(python -c 'import json; print(int(json.load(open("results/gws_verify_preplan/plan.json")).get("workers") or 0))')
          if [ "$REQUESTED" -le 0 ]; then
            mkdir -p results/gws_verify_preplan
            echo '{"allocated":0}' > results/gws_verify_preplan/broker.json
            echo 'allocated=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/global_capacity_broker.py reserve \
            --workload gws \
            --requested "$REQUESTED" \
            --demand-override "$REQUESTED" \
            --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out results/gws_verify_preplan/broker.json
          ALLOCATED=$(python -c 'import json; print(int(json.load(open("results/gws_verify_preplan/broker.json")).get("allocated") or 0))')
          echo "allocated=$ALLOCATED" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Build final verification matrix from brokered capacity
        env:
          ALLOCATED: ${{ steps.reserve.outputs.allocated }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/gws_pending_verify_plan.py \
            --outdir results/gws_verify_plan \
            --max-workers "${ALLOCATED:-0}" \
            --per-worker 15
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.workers != '0'
        with:
          name: gws-pending-verify-plan-${{ github.run_id }}
          path: results/gws_verify_plan/
          retention-days: 1
          compression-level: 6

  verify:
    needs: plan
    if: needs.plan.outputs.workers != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.workers) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.plan_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier and sidecar dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests 'ddgs>=9,<10' aiohttp 'huggingface_hub>=0.34,<2'
      - uses: actions/download-artifact@v4
        with:
          name: gws-pending-verify-plan-${{ github.run_id }}
          path: results/gws_verify_plan
      - name: Start hosted OpenSERP or arm fallback
        id: openserp
        shell: bash
        run: |
          set +e
          if bash tools/start_openserp_ci.sh; then
            echo 'url=http://127.0.0.1:7000' >> "$GITHUB_OUTPUT"
            echo 'mode=openserp_ci' >> "$GITHUB_OUTPUT"
          else
            echo 'url=' >> "$GITHUB_OUTPUT"
            echo 'mode=fallback_search_fabric' >> "$GITHUB_OUTPUT"
            echo 'OpenSERP unavailable; fallback may exclude owned sites but can never certify HIGH.'
          fi
          exit 0
      - name: Refresh current identity and verify pending partition
        env:
          OPENSERP_URL: ${{ steps.openserp.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p results/gws_verify_worker
          python tools/gws_pending_verify_worker.py \
            --input results/gws_verify_plan/pending.jsonl \
            --worker-index "${{ matrix.worker_index }}" \
            --worker-count "${{ matrix.worker_count }}" \
            --outdir results/gws_verify_worker \
            --threads 16
          python tools/gws_search_verify_source_safe.py \
            --shard-dir results/gws_verify_worker \
            --config config/gws_search_verify.json
      - name: Select fresh ambiguous rows for same-runner Qwen sidecar
        if: always()
        run: |
          python tools/gws_compound_semantic.py \
            --root results/gws_verify_worker \
            --out results/gws_verify_worker/compound_semantic/input.jsonl \
            --config config/gws_semantic_v1.json
      - name: Read pinned Qwen sidecar config
        if: always()
        id: qcfg
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          c=json.loads(Path('config/gws_semantic_v1.json').read_text())
          q=c['qwen']
          selected=0
          p=Path('results/gws_verify_worker/compound_semantic/input.jsonl')
          if p.exists(): selected=sum(1 for x in p.read_text(encoding='utf-8').splitlines() if x.strip())
          print('selected='+str(selected))
          print('repo='+q['model_repo'])
          print('revision='+q['model_revision'])
          print('file='+q['model_file'])
          print('label='+q['model_label'])
          PY
      - name: Restore Qwen model cache on same GWS worker
        if: always() && steps.qcfg.outputs.selected != '0'
        id: qcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/gws-qwen
          key: gws-qwen-${{ runner.os }}-${{ runner.arch }}-${{ steps.qcfg.outputs.label }}-${{ steps.qcfg.outputs.revision }}
      - name: Recover pinned Qwen model if cache is cold
        if: always() && steps.qcfg.outputs.selected != '0' && steps.qcache.outputs.cache-hit != 'true'
        env:
          QWEN_REPO: ${{ steps.qcfg.outputs.repo }}
          QWEN_REVISION: ${{ steps.qcfg.outputs.revision }}
          QWEN_FILE: ${{ steps.qcfg.outputs.file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          path=hf_hub_download(
              repo_id=os.environ['QWEN_REPO'],
              filename=os.environ['QWEN_FILE'],
              revision=os.environ['QWEN_REVISION'],
              local_dir=os.path.expanduser('~/.cache/gws-qwen'),
              local_dir_use_symlinks=False,
          )
          print('QWEN_MODEL='+path)
          PY
      - name: Start Qwen sidecar fail-open on same GWS worker
        if: always() && steps.qcfg.outputs.selected != '0'
        id: qwen
        shell: bash
        env:
          MODEL_FILE: ${{ steps.qcfg.outputs.file }}
        run: |
          set +e
          model="$HOME/.cache/gws-qwen/$MODEL_FILE"
          if [ ! -s "$model" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Qwen model unavailable; compound semantic sidecar skipped.'
            exit 0
          fi
          cid=$(docker run -d --rm --name "gws-qwen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.worker_index }}" \
            -p 127.0.0.1::8080 \
            -v "$HOME/.cache/gws-qwen:/models:ro" \
            ghcr.io/ggml-org/llama.cpp:server \
            -m "/models/$MODEL_FILE" -c 4096 -np 1 --host 0.0.0.0 --port 8080 2>/dev/null)
          if [ -z "$cid" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          port=$(docker port "$cid" 8080/tcp 2>/dev/null | awk -F: '{print $NF}' | tail -n1)
          for i in $(seq 1 80); do
            if [ -n "$port" ] && curl -fsS --max-time 2 "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "url=http://127.0.0.1:${port}/v1/chat/completions" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          docker rm -f "$cid" >/dev/null 2>&1 || true
          exit 0
      - name: Run semantic shadow on the already allocated GWS worker
        if: always() && steps.qcfg.outputs.selected != '0' && steps.qwen.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPENSERP_URL: ${{ steps.openserp.outputs.url }}
          QWEN_URL: ${{ steps.qwen.outputs.url }}
        run: |
          python tools/gws_home_semantic_worker.py \
            --input results/gws_verify_worker/compound_semantic/input.jsonl \
            --outdir results/gws_verify_worker/compound_semantic/worker \
            --endpoint "$OPENSERP_URL" \
            --engines bing,duckduckgo \
            --qwen-url "$QWEN_URL" \
            --qwen-model qwen3-4b \
            --max-candidates 8 \
            --record-concurrency 3 \
            --sleep-min 0.02 \
            --sleep-max 0.08
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-pending-verify-shard-${{ matrix.worker_index }}
          path: results/gws_verify_worker/
          retention-days: 1
          compression-level: 6

  aggregate:
    needs: [plan, verify]
    if: always() && needs.plan.outputs.workers != '0'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh durable main before aggregate
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: gws-pending-verify-shard-*
          path: results/gws_verify_shards
      - name: Aggregate strict results and preserve retryable backlog
        run: python tools/gws_pending_verify_aggregate.py --root results/gws_verify_shards --plan-dir results/gws_verify_plan
      - name: Persist verification durable state
        run: |
          set -euo pipefail
          git config user.name 'gws-strict-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add state/gws_verify_index.json state/gws_semantic_index.json metrics/gws_verify_latest.json gpt/gws_pending_batches.json gpt/gws_verified_pending.json gpt/gws_verified_review/ data/gws/verification/
          if git diff --cached --quiet; then
            echo 'No strict verification delta.'
            exit 0
          fi
          git commit -m "[gws-verify] strict search verification ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort >/dev/null 2>&1 || true
              echo 'Concurrent strict-state conflict; refusing unsafe merge.' >&2
              exit 1
            fi
            sleep $((attempt*3))
          done
          exit 1

  release_capacity_lease:
    needs: [plan, verify, aggregate]
    if: always()
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release broker capacity lease
        env:
          RUN_ID: ${{ github.run_id }}
        run: python tools/global_capacity_broker.py release --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY"
