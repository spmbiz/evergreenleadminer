name: Photo Quality Retry

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: photo-harvest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: photo-harvest/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install opencv-python-headless numpy
      - name: Harvest face-filtered replacements
        run: python quality_harvest.py 2>&1 | tee quality.log
      - name: Show totals
        if: always()
        run: cat people-photos-quality-retry/README.txt || true
      - name: Upload replacement ZIP and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: people-photos-quality-retry
          path: |
            photo-harvest/people-photos-quality-retry.zip
            photo-harvest/people-photos-quality-retry/manifest.csv
            photo-harvest/people-photos-quality-retry/failures.csv
            photo-harvest/people-photos-quality-retry/README.txt
            photo-harvest/quality.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
