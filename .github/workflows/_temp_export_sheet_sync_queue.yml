name: Temp Export Oldest Sheet Sync Queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_export_sheet_sync_queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect oldest 10 queue files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/queue10
          find gpt/sheet_sync_queue -maxdepth 1 -type f -name '*.jsonl' -printf '%f\n' | sort > /tmp/allfiles.txt
          head -n 10 /tmp/allfiles.txt > /tmp/files.txt
          if [ ! -s /tmp/files.txt ]; then echo QUEUE_EMPTY; fi
          while IFS= read -r f; do cp "gpt/sheet_sync_queue/$f" /tmp/queue10/; done < /tmp/files.txt
          cp /tmp/files.txt /tmp/queue10/_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-queue10
          path: /tmp/queue10
          if-no-files-found: error
          retention-days: 1
