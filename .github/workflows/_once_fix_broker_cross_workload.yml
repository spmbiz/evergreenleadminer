name: One-shot Fix Broker Cross Workload Concurrency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_once_fix_broker_cross_workload.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, gws-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel stale hosted migration attempt
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          foreach($rid in @('31993103685')){
            try {
              Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$rid/cancel" -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} | Out-Null
              Write-Host "CANCELLED_STALE_MIGRATION=$rid"
            } catch { Write-Host "STALE_CANCEL_NONFATAL=$rid $($_.Exception.Message)" }
          }
          exit 0
      - name: Resolve existing local Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@(
            'C:\Users\walid\AppData\Local\Programs\Python\Python313\python.exe',
            'C:\Users\walid\AppData\Local\Programs\Python\Python312\python.exe',
            'C:\Users\walid\AppData\Local\Programs\Python\Python311\python.exe',
            'C:\Python313\python.exe','C:\Python312\python.exe','C:\Python311\python.exe'
          )
          $py=$null
          foreach($candidate in $candidates){if(Test-Path $candidate){$py=$candidate;break}}
          if(-not $py){
            $cmd=Get-Command python.exe -ErrorAction SilentlyContinue
            if($cmd -and $cmd.Source -notlike '*WindowsApps*'){$py=$cmd.Source}
          }
          if(-not $py){throw 'Usable local Python not found'}
          $py | Out-File -Encoding ascii .broker-migration-python.txt
          Write-Host "BROKER_MIGRATION_PYTHON=$py"
      - name: Patch and validate broker architecture
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          git reset --hard origin/main
          $py=(Get-Content .broker-migration-python.txt -Raw).Trim()
          & $py tools\_once_fix_broker_cross_workload.py
          if($LASTEXITCODE -ne 0){throw "migration helper failed exit=$LASTEXITCODE"}
          & $py -m py_compile tools\global_capacity_broker_v3.py tools\global_capacity_broker.py
          if($LASTEXITCODE -ne 0){throw "broker compile failed exit=$LASTEXITCODE"}
      - name: Commit migration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'broker-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gws-pending-search-verify.yml .github/workflows/gws-autonomous-fleet.yml .github/workflows/gws-semantic-fleet.yml .github/workflows/hospitality-autonomous-fleet.yml .github/workflows/hospitality-intelligence-v2.yml tools/global_capacity_broker_v3.py
          if(git diff --cached --quiet){Write-Host 'No migration delta.';exit 0}
          git commit -m 'fleet: allow cross-workload planning without broker self-cancel [skip ci]'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          for($attempt=1;$attempt -le 4;$attempt++){
            git push origin HEAD:main
            if($LASTEXITCODE -eq 0){exit 0}
            git fetch origin main
            git rebase origin/main
            if($LASTEXITCODE -ne 0){git rebase --abort;throw 'rebase failed'}
            Start-Sleep -Seconds ($attempt*2)
          }
          throw 'git push failed after retries'
