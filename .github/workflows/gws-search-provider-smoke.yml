name: GWS Search Provider Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/gws_search_provider_smoke.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public search interfaces from GitHub runner
        run: python tools/gws_search_provider_smoke.py
