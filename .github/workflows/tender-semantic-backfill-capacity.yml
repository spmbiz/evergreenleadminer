name: Tender Semantic Backfill Capacity

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/tender_semantic_backfill_capacity.py'
      - '.github/workflows/tender-semantic-backfill-capacity.yml'
      - 'control/tender_semantic_capacity_trigger.json'

permissions:
  contents: write

concurrency:
  group: tender-semantic-backfill-capacity
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tune split from durable Tender backlog and repair broker identity
        run: python tools/tender_semantic_backfill_capacity.py
      - name: Commit only when a threshold or broker identity changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/global_fleet.json tools/global_capacity_broker_v3.py; then
            echo 'Capacity threshold unchanged'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add config/global_fleet.json tools/global_capacity_broker_v3.py
          git commit -m 'fleet: tune Tender semantic backfill capacity'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
