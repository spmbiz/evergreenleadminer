name: Global Fleet Hot-Loop Watchdog

# Autonomous Fleet Continuation already refills Hospitality/GWS immediately on
# every natural completion. This watchdog is deliberately only a low-frequency
# recovery net so control-plane jobs cannot starve real harvest matrix workers.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hospitality-continuous-controller.yml'
      - 'config/global_fleet.json'
      - 'tools/global_capacity_broker_v3.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: global-fleet-hot-loop-watchdog
  cancel-in-progress: true

jobs:
  refill_idle_workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe durable backlog and refill idle workload queues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python tools/hospitality_master_plan.py \
            --provider github \
            --capacity 1 \
            --out /tmp/hospitality-probe.json >/dev/null

          python - <<'PY' >/tmp/demand.json
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import global_capacity_broker as broker
          desired=json.load(open('control/desired_state.json'))
          hp=json.load(open('/tmp/hospitality-probe.json'))
          d=broker._effective_local_demand()
          print(json.dumps({
              'enabled': bool(desired.get('enabled')) and bool(desired.get('continuous', True)),
              'hospitality': int(hp.get('useful_backlog') or 0),
              'gws': int(d.get('gws') or 0),
              'tenders': int(d.get('tenders') or 0),
          }))
          PY
          cat /tmp/demand.json

          ENABLED=$(python -c 'import json; print("true" if json.load(open("/tmp/demand.json"))["enabled"] else "false")')
          [ "$ENABLED" = "true" ] || { echo "Fleet disabled; watchdog idle."; exit 0; }

          maybe_dispatch () {
            local workflow_file="$1"
            local backlog="$2"
            local label="$3"
            if [ "$backlog" -le 0 ]; then
              echo "$label backlog=0; idle share is borrowable."
              return 0
            fi
            local active
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
            if [ "$active" -gt 0 ]; then
              echo "$label already has $active active/queued run(s)."
              return 0
            fi
            gh workflow run "$workflow_file" --ref main
            echo "Dispatched $label recovery run for backlog=$backlog"
          }

          HOSP=$(python -c 'import json; print(json.load(open("/tmp/demand.json"))["hospitality"])')
          GWS=$(python -c 'import json; print(json.load(open("/tmp/demand.json"))["gws"])')

          maybe_dispatch hospitality-autonomous-fleet.yml "$HOSP" hospitality
          maybe_dispatch gws-autonomous-fleet.yml "$GWS" gws

          echo "Failsafe only. Immediate refill is owned by Autonomous Fleet Continuation."
