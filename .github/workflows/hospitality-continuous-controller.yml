name: Hospitality Continuous Controller

on:
  workflow_run:
    workflows: ["Hospitality Autonomous Fleet 24/7"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hospitality-continuous-controller.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: hospitality-continuous-controller
  cancel-in-progress: true

jobs:
  keep_fleet_hot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reclaim obviously stale legacy GWS runner slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gws-legacy-autonomous-cert-v53.yml/runs?status=in_progress&per_page=20" \
            --jq '.workflow_runs[] | [.id,.created_at] | @tsv' | \
          while IFS=$'\t' read -r RUN_ID CREATED; do
            [ -n "${RUN_ID:-}" ] || continue
            CREATED_EPOCH=$(date -u -d "$CREATED" +%s || echo "$NOW")
            AGE=$((NOW-CREATED_EPOCH))
            if [ "$AGE" -ge 5400 ]; then
              echo "Cancelling stale legacy GWS run $RUN_ID age=${AGE}s"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" || true
            fi
          done

      - name: Dispatch next hospitality wave when idle and useful backlog remains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hospitality-autonomous-fleet.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Hospitality already has $ACTIVE queued/in-progress run(s); no duplicate dispatch."
            exit 0
          fi

          python tools/hospitality_master_plan.py \
            --provider github \
            --capacity 1 \
            --out /tmp/hospitality-probe.json >/tmp/hospitality-probe.log

          ENABLED=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/hospitality-probe.json'))
          print('true' if p.get('enabled') else 'false')
          PY
          )
          BACKLOG=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/hospitality-probe.json'))
          print(int(p.get('useful_backlog') or 0))
          PY
          )

          echo "enabled=$ENABLED useful_backlog=$BACKLOG"
          if [ "$ENABLED" != "true" ] || [ "$BACKLOG" -le 0 ]; then
            echo "No useful hospitality work remains (or fleet disabled); controller goes idle."
            exit 0
          fi

          gh workflow run hospitality-autonomous-fleet.yml --ref main
          echo "Dispatched next hospitality wave immediately."
