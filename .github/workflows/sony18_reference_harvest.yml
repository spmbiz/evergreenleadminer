name: Sony incomplete films completion PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sony-animation-reference-finish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harvest:
    name: Complete Sony film ${{ matrix.film }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        film: [0, 2, 4, 5, 6, 7, 8, 9, 11, 13, 14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow imagehash numpy opencv-python-headless "yt-dlp[default]"
      - name: Harvest safe completion pack
        run: python tools/harvest_sony18_fast.py --group ${{ matrix.film }} --output output
      - name: Validate deliverable
        if: always()
        run: |
          find output -name MANIFEST.json -print
          find output -type f -path '*/STYLE_PACK_24/*.jpg' | wc -l
          find output -type f -path '*/CHARACTER_PACK/*/*.jpg' | wc -l
          find output -name STYLE_CONTACT_SHEET.jpg -print
          find output -name CHARACTER_CONTACT_SHEET.jpg -print
      - name: Upload completed film pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sony-finish-pr-film-${{ matrix.film }}
          path: output/
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
