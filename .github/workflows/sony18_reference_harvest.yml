name: Sony final strict style completion PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sony-animation-reference-finish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harvest:
    name: Final strict Sony film ${{ matrix.film }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        film: [1, 3, 5, 10, 11, 12, 14, 16]
    steps:
      - uses: actions/checkout@v4
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow imagehash numpy opencv-python-headless "yt-dlp[default]"
      - name: Harvest final strict style pack
        run: |
          mkdir -p output
          set +e
          python -m tools.harvest_sony18_quality_v3 --group ${{ matrix.film }} --output output > output/HARVEST_STDOUT.txt 2>&1
          code=$?
          cat output/HARVEST_STDOUT.txt
          exit $code
      - name: Validate final style deliverable
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifests=list(Path('output').rglob('MANIFEST.json'))
          if not manifests:
              raise SystemExit('No manifest produced')
          failed=[]
          for path in manifests:
              data=json.loads(path.read_text())
              style=len(list((path.parent/'STYLE_PACK_24').glob('*.jpg')))
              print(data['title'], 'style', style, '/24')
              if style < 24:
                  failed.append(data['title'])
          if failed:
              raise SystemExit('Incomplete style packs: '+', '.join(failed))
          PY
          find output -name STYLE_CONTACT_SHEET.jpg -print || true
      - name: Upload final strict style pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sony-quality-v3-film-${{ matrix.film }}
          path: output/
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
