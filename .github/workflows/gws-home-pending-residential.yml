name: GWS Home Pending Residential OpenSERP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: Max pending candidates to inspect on the home residential lane
        required: false
        default: '12'
  push:
    branches: [main]
    paths:
      - 'gpt/gws_pending_batches.json'
      - 'control/gws_home_pending_kick.json'
      - 'tools/gws_home_openserp_worker_v55.py'
      - 'tools/gws_home_openserp_worker_ownership_safe.py'
      - 'tools/gws_residential_ingress_adapter.py'
      - 'tools/gws_ownership_gate.py'
      - 'tools/test_gws_ownership_regression.py'
      - '.github/workflows/gws-home-pending-residential.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gws-home-pending-residential
  cancel-in-progress: false

jobs:
  residential_pending:
    runs-on: [self-hosted, Windows, X64, gws-home]
    timeout-minutes: 45
    env:
      MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '12' }}
      OPENSERP_HOME_DIR: 'C:\Users\walid\openserp-home\OpenSERP'
      OPENSERP_HOME_PORT: '7000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh current durable main
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git fetch origin main
          git reset --hard origin/main
          Write-Host "Residential GWS pending lane on $(git rev-parse HEAD)"

      - name: Ensure residential OpenSERP before any Python setup
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $port = [int]$env:OPENSERP_HOME_PORT
          $root = $env:OPENSERP_HOME_DIR
          function Test-OpenSerp {
            param([int]$Port)
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 4 -Uri "http://127.0.0.1:$Port/health"
              return ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300)
            } catch { return $false }
          }
          if (Test-OpenSerp -Port $port) {
            Write-Host "OPENSERP_HOME_OK backend=existing port=$port"
            exit 0
          }
          if (-not (Test-Path (Join-Path $root 'OpenSerp.AppHost.exe'))) {
            throw "OpenSERP binary missing at $root"
          }
          Start-Process -FilePath (Join-Path $root 'OpenSerp.AppHost.exe') -ArgumentList "--urls=http://127.0.0.1:$port" -WorkingDirectory $root -WindowStyle Hidden
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (Test-OpenSerp -Port $port) {
              Write-Host "OPENSERP_HOME_OK backend=started port=$port"
              exit 0
            }
          }
          throw "OpenSERP failed to become healthy on port $port"

      - name: Resolve existing local Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Users\walid\AppData\Local\Programs\Python\Python313\python.exe',
            'C:\Users\walid\AppData\Local\Programs\Python\Python312\python.exe',
            'C:\Users\walid\AppData\Local\Programs\Python\Python311\python.exe',
            'C:\Python313\python.exe',
            'C:\Python312\python.exe',
            'C:\Python311\python.exe'
          )
          $py = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) { $py = $candidate; break }
          }
          if (-not $py) {
            $cmd = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source -notlike '*WindowsApps*') { $py = $cmd.Source }
          }
          if (-not $py) { throw 'Usable local Python not found; refusing Microsoft Store alias.' }
          Write-Host "Using Python $py"
          $py | Out-File -Encoding ascii .gws-home-python.txt

      - name: Ownership recall regression smoke
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Content .gws-home-python.txt -Raw).Trim()
          & $py tools\test_gws_ownership_regression.py
          if ($LASTEXITCODE -ne 0) { throw "Ownership regression failed with exit $LASTEXITCODE" }

      - name: Select bounded high-value current pending batch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Content .gws-home-python.txt -Raw).Trim()
          New-Item -ItemType Directory -Force -Path results\gws_home_pending | Out-Null
          & $py tools\gws_pending_verify_plan.py --outdir results\gws_home_pending\plan --max-workers 1 --per-worker $env:MAX_CANDIDATES
          if ($LASTEXITCODE -ne 0) { throw "Planner failed with exit $LASTEXITCODE" }
          if (-not (Test-Path results\gws_home_pending\plan\pending.jsonl)) {
            New-Item -ItemType File -Force -Path results\gws_home_pending\plan\pending.jsonl | Out-Null
          }
          $count = 0
          if ((Get-Item results\gws_home_pending\plan\pending.jsonl).Length -gt 0) {
            $count = (Get-Content results\gws_home_pending\plan\pending.jsonl | Measure-Object -Line).Lines
          }
          Write-Host "HOME_PENDING_SELECTED=$count"
          "selected=$count" | Out-File -Encoding ascii results\gws_home_pending\selected.txt

      - name: Adapt current pending records for residential worker
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Content .gws-home-python.txt -Raw).Trim()
          $selectedLine = Get-Content results\gws_home_pending\selected.txt
          $selected = [int](($selectedLine -split '=')[1])
          if ($selected -le 0) {
            Write-Host 'No pending records selected; adapter skipped.'
            New-Item -ItemType File -Force -Path results\gws_home_pending\residential_input.jsonl | Out-Null
            exit 0
          }
          & $py tools\gws_home_pending_adapter.py `
            --input results\gws_home_pending\plan\pending.jsonl `
            --out results\gws_home_pending\residential_input.jsonl
          if ($LASTEXITCODE -ne 0) { throw "Adapter failed with exit $LASTEXITCODE" }

      - name: Run bounded residential OpenSERP evidence pass
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Content .gws-home-python.txt -Raw).Trim()
          $selectedLine = Get-Content results\gws_home_pending\selected.txt
          $selected = [int](($selectedLine -split '=')[1])
          New-Item -ItemType Directory -Force -Path results\gws_home_pending\worker | Out-Null
          if ($selected -le 0) {
            Write-Host 'No pending records selected; worker skipped.'
            '{"schema":"gws-home-openserp-worker-v5","attempted":0,"statuses":{},"final_high":0,"note":"No pending work selected."}' | Out-File -Encoding utf8 results\gws_home_pending\worker\summary.json
            New-Item -ItemType File -Force -Path results\gws_home_pending\worker\results.jsonl | Out-Null
            exit 0
          }
          & $py tools\gws_home_openserp_worker_ownership_safe.py `
            --input results\gws_home_pending\residential_input.jsonl `
            --outdir results\gws_home_pending\worker `
            --endpoint "http://127.0.0.1:$env:OPENSERP_HOME_PORT" `
            --engines bing,duckduckgo `
            --max-candidates $env:MAX_CANDIDATES `
            --candidate-concurrency 6 `
            --sleep-min 0.05 `
            --sleep-max 0.15
          if ($LASTEXITCODE -ne 0) { throw "Residential worker failed with exit $LASTEXITCODE" }
          Get-Content results\gws_home_pending\worker\summary.json

      - name: Normalize raw worker output into durable residential ingress
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $py = (Get-Content .gws-home-python.txt -Raw).Trim()
          $selectedLine = Get-Content results\gws_home_pending\selected.txt
          $selected = [int](($selectedLine -split '=')[1])
          $results = 'results\gws_home_pending\worker\results.jsonl'
          $out = 'results\gws_home_pending\residential_ingress.jsonl'
          if ($selected -le 0) {
            New-Item -ItemType File -Force -Path $out | Out-Null
            'normalized=0' | Out-File -Encoding ascii results\gws_home_pending\normalized.txt
            Write-Host 'No selected work; ingress normalization skipped.'
            exit 0
          }
          if (-not (Test-Path $results) -or (Get-Item $results).Length -eq 0) {
            New-Item -ItemType File -Force -Path $out | Out-Null
            'normalized=0' | Out-File -Encoding ascii results\gws_home_pending\normalized.txt
            throw 'Selected residential work produced no worker results.'
          }
          & $py tools\gws_residential_ingress_adapter.py --input $results --out $out
          if ($LASTEXITCODE -ne 0) { throw "Residential ingress adapter failed with exit $LASTEXITCODE" }
          $normalized = 0
          if ((Get-Item $out).Length -gt 0) {
            $normalized = (Get-Content $out | Measure-Object -Line).Lines
          }
          "normalized=$normalized" | Out-File -Encoding ascii results\gws_home_pending\normalized.txt
          Write-Host "HOME_INGRESS_NORMALIZED=$normalized selected=$selected"
          if ($normalized -ne $selected) {
            throw "Residential ingress count mismatch selected=$selected normalized=$normalized. Partial evidence remains available for durable persistence."
          }

      - name: Persist immutable residential ingress with readback and wake semantic fleet
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ingress = 'results\gws_home_pending\residential_ingress.jsonl'
          if (-not (Test-Path $ingress) -or (Get-Item $ingress).Length -eq 0) {
            Write-Host 'No residential ingress evidence to persist.'
            exit 0
          }
          $normalized = (Get-Content $ingress | Measure-Object -Line).Lines
          if ($normalized -le 0) { throw 'Non-empty ingress file has zero lines.' }

          $repoPath = "data/gws/residential_ingress/run_$env:RUN_ID.jsonl"
          $destDir = 'data\gws\residential_ingress'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item $ingress ("data\gws\residential_ingress\run_$env:RUN_ID.jsonl") -Force

          $auditDest = "data\gws\observations\home_openserp\$env:RUN_ID"
          New-Item -ItemType Directory -Force -Path $auditDest | Out-Null
          Copy-Item results\gws_home_pending\worker\summary.json (Join-Path $auditDest 'worker_summary.json') -Force
          if (Test-Path results\gws_home_pending\worker\progress.json) {
            Copy-Item results\gws_home_pending\worker\progress.json (Join-Path $auditDest 'worker_progress.json') -Force
          }

          git config user.name 'gws-home-residential'
          git config user.email 'actions@users.noreply.github.com'
          git add $repoPath $auditDest
          if (git diff --cached --quiet) {
            throw 'Residential ingress existed locally but produced no durable git delta.'
          }
          git commit -m "[gws-home-evidence] residential pending $env:RUN_ID [skip ci]"
          $pushed = $false
          for ($attempt=1; $attempt -le 4; $attempt++) {
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Unsafe residential evidence rebase conflict; refusing to overwrite durable state.'
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $pushed) { throw 'Failed to persist residential ingress after retries.' }

          git fetch origin main
          $readback = @(git show "origin/main:$repoPath")
          if ($LASTEXITCODE -ne 0) { throw "Durable residential ingress readback failed for $repoPath" }
          $readbackCount = ($readback | Where-Object { $_ -ne '' } | Measure-Object -Line).Lines
          Write-Host "HOME_INGRESS_READBACK=$readbackCount expected=$normalized path=$repoPath"
          if ($readbackCount -ne $normalized) {
            throw "Residential ingress readback mismatch expected=$normalized actual=$readbackCount"
          }

          gh api --method POST "repos/$env:GITHUB_REPOSITORY/dispatches" -f event_type='gws_semantic_refill'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-home-pending-${{ github.run_id }}
          path: results/gws_home_pending/
          retention-days: 1
          compression-level: 6
