name: Hospitality 5-Minute Heartbeat

# Productive plan/harvest activity, not aggregate tail activity, controls redispatch.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hospitality-5min-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hospitality-5min-heartbeat
  cancel-in-progress: true

jobs:
  ensure_fleet_alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check desired state and productive harvest activity
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENABLED=$(python - <<'PY'
          import json
          d=json.load(open('control/desired_state.json'))
          print('true' if bool(d.get('enabled')) and bool(d.get('continuous', True)) else 'false')
          PY
          )
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "productive_active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/hospitality-autonomous-fleet.yml/runs?per_page=20" \
            > /tmp/runs.json

          PRODUCTIVE=$(python - <<'PY'
          import json, os, subprocess, sys
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs') or []
          active=[r for r in runs if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
          for r in active:
              if r.get('status') != 'in_progress':
                  print('true')
                  print('Pending hospitality cycle:', r.get('id'), r.get('status'), file=sys.stderr)
                  raise SystemExit
              url=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{r['id']}/jobs?per_page=100"
              p=subprocess.run(['gh','api','-H','Accept: application/vnd.github+json',url],text=True,capture_output=True)
              if p.returncode:
                  print('true')
                  print('Could not inspect active run jobs; conservatively treating active:', r.get('id'), file=sys.stderr)
                  raise SystemExit
              jobs=(json.loads(p.stdout).get('jobs') or [])
              for j in jobs:
                  if j.get('status') not in {'queued','in_progress','waiting','pending','requested'}:
                      continue
                  name=str(j.get('name') or '').lower()
                  if name == 'plan' or name.startswith('harvest'):
                      print('true')
                      print('Productive hospitality work active:', r.get('id'), j.get('name'), j.get('status'), file=sys.stderr)
                      raise SystemExit
          print('false')
          PY
          )
          echo "productive_active=$PRODUCTIVE" >> "$GITHUB_OUTPUT"

      - name: Redispatch hospitality harvest when productive workers are idle
        if: steps.guard.outputs.enabled == 'true' && steps.guard.outputs.productive_active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"main","inputs":{"force_workers":"0","force_lane":""}}' | \
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/hospitality-autonomous-fleet.yml/dispatches" \
              --input -
          echo 'No plan/harvest work was active; dispatched another leased autonomous cycle.'

      - name: Report healthy
        if: steps.guard.outputs.enabled != 'true' || steps.guard.outputs.productive_active == 'true'
        run: echo 'Heartbeat healthy; productive harvest already active or fleet disabled.'
