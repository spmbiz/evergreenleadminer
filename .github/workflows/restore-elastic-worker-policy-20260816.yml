name: Restore Elastic Worker Policy 2026-08-16

on:
  workflow_dispatch:
  schedule:
    - cron: '5,25,45 6 16 8 *'
    - cron: '5 7 16 8 *'

permissions:
  contents: write

concurrency:
  group: ai-prod-global-capacity-broker
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore 25/25/25 base plus 25 percent elastic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/global_fleet.json')
          d=json.loads(p.read_text())
          gh=d.setdefault('github',{})
          gh.pop('temporary_allocation_note',None)
          gh['capacity']=20
          gh['idle_capacity_policy']='borrow_immediately'
          gh['preemption_policy']='natural_completion_only'
          for name in ('hospitality','tenders','gws'):
              w=d.setdefault('workloads',{}).setdefault(name,{})
              w['enabled']=True
              w['weight']=0.25
              w['min_slots_when_demanding']=5
              w['max_slots']=20
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/global_fleet.json
          git diff --cached --quiet && exit 0
          git commit -m 'fleet: restore 25/25/25 base with elastic remainder'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt*3))"
          done
          exit 1
