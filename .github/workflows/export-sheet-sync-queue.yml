name: Export Sheet Sync Queue

on:
  push:
    branches: [main]
    paths:
      - 'control/sheet_queue_export_trigger.json'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package queue snapshot
        run: |
          set -euo pipefail
          mkdir -p bundle
          mode="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('control/sheet_queue_export_trigger.json')
          try:
              print(json.loads(p.read_text()).get('mode','batch10'))
          except Exception:
              print('batch10')
          PY
          )"
          if [[ "$mode" == "drain_queue" ]]; then
            mapfile -t files < <(find gpt/sheet_sync_queue -maxdepth 1 -type f -name '*.jsonl' -printf '%p\n' | sort)
          else
            mapfile -t files < <(find gpt/sheet_sync_queue -maxdepth 1 -type f -name '*.jsonl' -printf '%p\n' | sort | head -10)
          fi
          printf '%s\n' "${files[@]}" > bundle/manifest.txt
          for f in "${files[@]}"; do cp "$f" bundle/; done
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('bundle/manifest.txt')
          files=[x.strip() for x in p.read_text().splitlines() if x.strip()]
          out={'chunks':files,'chunk_count':len(files)}
          pathlib.Path('bundle/manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(out)
          PY
      - name: Build deterministic Sheets staging
        if: ${{ hashFiles('gpt/sheet_sync_queue/*.jsonl') != '' }}
        run: |
          set -euo pipefail
          python tools/build_sheet_sync_staging.py \
            --queue gpt/sheet_sync_queue \
            --out staging/sheet_sync_latest \
            --chunk-rows 500
          cp staging/sheet_sync_latest/manifest.json bundle/staging-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-queue-snapshot
          path: bundle/
          retention-days: 1
          compression-level: 6
      - name: Publish staging snapshot for Google Sheets
        if: ${{ hashFiles('staging/sheet_sync_latest/manifest.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name 'ai-prod-sheet-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add -A staging/sheet_sync_latest
          if git diff --cached --quiet; then
            echo 'Staging unchanged.'
            exit 0
          fi
          git commit -m 'fleet: publish MASTER Sheet staging [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
