name: Animation reference harvest remaining 40

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Manual full harvest group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install --upgrade pip && python -m pip install requests beautifulsoup4 pillow imagehash numpy opencv-python-headless yt-dlp
      - run: python tools/harvest40.py --group ${{ matrix.group }} --output output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining40-wave-group-${{ matrix.group }}
          path: output/
          compression-level: 6
          retention-days: 7
