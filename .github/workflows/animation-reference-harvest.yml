name: Animation reference harvest remaining 40

on:
  push:
    branches:
      - automation/animation-reference-harvest-40
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Harvest group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow imagehash numpy opencv-python-headless yt-dlp
      - name: Harvest official references
        run: python tools/harvest40.py --group ${{ matrix.group }} --output output
      - name: Validate group
        if: always()
        run: |
          find output -name MANIFEST.json -print | wc -l
          find output -name STYLE_CONTACT_SHEET.jpg -print | wc -l
      - name: Upload group artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining40-wave-group-${{ matrix.group }}
          path: output/
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
