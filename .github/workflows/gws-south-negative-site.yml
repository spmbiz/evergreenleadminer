name: GWS South Brussels Negative Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gws_south_negative_site.py'
      - '.github/workflows/gws-south-negative-site.yml'

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install resolver dependency
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Run South Brussels resolver
        run: python tools/gws_south_negative_site.py
      - name: Show summary
        if: always()
        run: test ! -f results/gws_brussels_resolver_v2/summary.json || cat results/gws_brussels_resolver_v2/summary.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gws-south-negative-site
          path: results/gws_brussels_resolver_v2/
          retention-days: 7
