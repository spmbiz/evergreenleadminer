name: TMP Export Sheet Sync 061-070
on:
  push:
    paths:
      - '.github/workflows/tmp-pack-sheet-sync-061-070.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged payload
        run: |
          test -s gpt/sync_payload_061_070.tsv
          test -s gpt/sync_summary_061_070.json
          wc -l gpt/sync_payload_061_070.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-payload-061-070
          path: |
            gpt/sync_payload_061_070.tsv
            gpt/sync_summary_061_070.json
          retention-days: 1
