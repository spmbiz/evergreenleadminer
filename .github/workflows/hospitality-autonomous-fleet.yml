name: Hospitality Autonomous Fleet 24/7

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'control/hospitality_test.json'
  workflow_dispatch:
    inputs:
      force_workers:
        description: 'Optional canary worker count (0 = durable autoscaler)'
        required: false
        default: '0'
      force_lane:
        description: 'Optional lane override: fast_email, site_recovery, atp, or osm'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: hospitality-autonomous-fleet
  cancel-in-progress: false

jobs:
  plan:
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.emit.outputs.enabled }}
      cycle_id: ${{ steps.emit.outputs.cycle_id }}
      matrix: ${{ steps.emit.outputs.matrix }}
      worker_count: ${{ steps.emit.outputs.worker_count }}
      cloud_capacity: ${{ steps.emit.outputs.cloud_capacity }}
      local_workers: ${{ steps.emit.outputs.local_workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize fleet state
        run: |
          mkdir -p planner
          python tools/fleet_runtime.py init
      - name: Reserve account-wide slots and plan world + approved source tasks
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FORCE: ${{ github.event.inputs.force_workers || '0' }}
          DISPATCH_LANE: ${{ github.event.inputs.force_lane || '' }}
        run: |
          set -euo pipefail
          FORCE=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE="${DISPATCH_FORCE:-0}"
          elif [ "$EVENT_NAME" = "push" ] && [ -f control/hospitality_test.json ]; then
            FORCE=$(python - <<'PY'
          import json
          try:
              print(int(json.load(open('control/hospitality_test.json')).get('force_workers') or 0))
          except Exception:
              print(0)
          PY
          )
          fi
          if [ "${FORCE:-0}" -gt 0 ]; then
            REQUEST_JSON=$(python tools/hospitality_scheduler.py capacity --available 20 --force "$FORCE")
          else
            REQUEST_JSON=$(python tools/hospitality_scheduler.py capacity --available 20)
          fi
          REQUESTED=$(python -c 'import json,sys; print(json.load(sys.stdin)["chosen"])' <<<"$REQUEST_JSON")
          python tools/global_capacity_broker.py reserve \
            --workload hospitality \
            --requested "$REQUESTED" \
            --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out planner/broker.json
          ALLOCATED=$(python -c 'import json; print(int(json.load(open("planner/broker.json")).get("allocated") or 0))')
          python - <<'PY'
          import json
          b=json.load(open('planner/broker.json'))
          out={
            'available': int(b.get('capacity') or 20)-int(b.get('external_slots') or 0)-int(b.get('leased_other_slots') or 0),
            'requested': int(b.get('requested') or 0),
            'chosen': int(b.get('allocated') or 0),
            'external_slots': int(b.get('external_slots') or 0),
            'sibling_headroom': int(b.get('sibling_headroom') or 0),
            'reason': 'global_broker_lease'
          }
          open('planner/cloud-capacity.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          ARGS=(--provider github --capacity "$ALLOCATED" --out planner/plan.json)
          if [ -n "${DISPATCH_LANE:-}" ]; then
            ARGS+=(--force-lane "$DISPATCH_LANE")
          fi
          python tools/hospitality_master_plan.py "${ARGS[@]}"
      - name: Build read-only canonical domain snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p planner/canonical
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-canonical.sqlite' \
            --dir planner/canonical \
            --clobber || true
          python - <<'PY'
          import gzip,sqlite3
          from pathlib import Path
          db=Path('planner/canonical/hospitality-canonical.sqlite')
          out=Path('planner/canonical-domains.txt.gz')
          domains=[]
          if db.exists():
              con=sqlite3.connect(db)
              try: domains=[str(r[0]).strip().lower() for r in con.execute("SELECT domain FROM leads WHERE domain IS NOT NULL AND domain<>''")]
              finally: con.close()
          with gzip.open(out,'wt',encoding='utf-8') as f:
              for d in sorted(set(domains)): f.write(d+'\n')
          print({'canonical_domains':len(set(domains)),'path':str(out)})
          PY
          rm -rf planner/canonical
      - id: emit
        name: Emit dynamic matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('planner/plan.json'))
          c=json.load(open('planner/cloud-capacity.json'))
          inc=p.get('include') or []
          print('enabled='+str(bool(p.get('enabled'))).lower())
          print('cycle_id='+str(p.get('cycle_id') or 'none'))
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          print('worker_count='+str(len(inc)))
          print('cloud_capacity='+str(int(c.get('chosen') or 0)))
          print('local_workers='+str(int(p.get('local_workers') or 0)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-plan-${{ steps.emit.outputs.cycle_id }}
          path: planner/
          retention-days: 1
          compression-level: 6

  harvest:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal worker dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests ijson osmium
      - name: Download read-only canonical snapshot
        uses: actions/download-artifact@v4
        with:
          name: hospitality-plan-${{ needs.plan.outputs.cycle_id }}
          path: planner_input
      - name: Harvest and live-verify task
        run: |
          set -euo pipefail
          mkdir -p "results/${{ matrix.key }}"
          if [ "${{ matrix.task_type }}" = "atp_spider" ]; then
            python tools/hospitality_atp_worker.py \
              --provider github \
              --cycle-id "${{ needs.plan.outputs.cycle_id }}" \
              --spider "${{ matrix.spider }}" \
              --expected-release "${{ matrix.release }}" \
              --canonical-domains "planner_input/canonical-domains.txt.gz" \
              --local-workers "${{ matrix.local_workers }}" \
              --outdir "results/${{ matrix.key }}"
          elif [ "${{ matrix.task_type }}" = "osm_geofabrik" ]; then
            python tools/hospitality_osm_worker.py \
              --provider github \
              --cycle-id "${{ needs.plan.outputs.cycle_id }}" \
              --extract-id "${{ matrix.extract_id }}" \
              --expected-release "${{ matrix.release }}" \
              --canonical-domains "planner_input/canonical-domains.txt.gz" \
              --local-workers "${{ matrix.local_workers }}" \
              --contact-workers "${{ matrix.contact_workers }}" \
              --outdir "results/${{ matrix.key }}"
          else
            python tools/hospitality_worker.py \
              --provider github \
              --cycle-id "${{ needs.plan.outputs.cycle_id }}" \
              --name "${{ matrix.name }}" \
              --country "${{ matrix.country }}" \
              --region "${{ matrix.region }}" \
              --bbox="${{ matrix.bbox }}" \
              --release "${{ matrix.release }}" \
              --max-rows "${{ matrix.max_rows }}" \
              --lane "${{ matrix.lane }}" \
              --canonical-domains "planner_input/canonical-domains.txt.gz" \
              --local-workers "${{ matrix.local_workers }}" \
              --contact-workers "${{ matrix.contact_workers }}" \
              --contact-timeout "${{ matrix.contact_timeout }}" \
              --contact-max-pages "${{ matrix.contact_max_pages }}" \
              --contact-max-bytes "${{ matrix.contact_max_bytes }}" \
              --verify-engine thread \
              --outdir "results/${{ matrix.key }}"
          fi
      - name: Upload transport artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-worker-${{ needs.plan.outputs.cycle_id }}-${{ matrix.key }}
          path: results/${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6

  aggregate:
    needs: [plan, harvest]
    if: always() && needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CYCLE_ID: ${{ needs.plan.outputs.cycle_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download plan and worker partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hospitality-*
          path: incoming
      - name: Restore durable canonical SQLite if present
        run: |
          mkdir -p canonical aggregate_out
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-canonical.sqlite' \
            --dir canonical \
            --clobber || true
      - name: Single-writer canonical aggregate
        run: |
          python tools/hospitality_fleet_aggregate.py \
            --results-root incoming \
            --cycle-id "$CYCLE_ID" \
            --provider github \
            --canonical-db canonical/hospitality-canonical.sqlite \
            --outdir aggregate_out
          python tools/hospitality_scheduler.py after --metrics metrics/latest.json
      - name: Preserve enriched observations beyond temporary artifacts
        run: |
          python - <<'PY'
          import csv,gzip,json,os
          from pathlib import Path
          cycle=os.environ['CYCLE_ID']
          root=Path('incoming')
          out=Path('aggregate_out')/f'observations-{cycle}.jsonl.gz'
          n=0
          with gzip.open(out,'wt',encoding='utf-8') as z:
              for p in root.rglob('v6_fast_ready.csv'):
                  with p.open(encoding='utf-8',newline='') as f:
                      for r in csv.DictReader(f):
                          r['_transport_path']=str(p)
                          z.write(json.dumps(r,ensure_ascii=False)+'\n')
                          n+=1
          print(json.dumps({'observations_persisted':n,'path':str(out)}))
          PY
      - name: Package immutable cycle bundle
        run: |
          BUNDLE="aggregate_out/hospitality-bundle-${CYCLE_ID}.tar.gz"
          FILES=$(find aggregate_out -maxdepth 1 -type f \( -name 'partition-*.jsonl.gz' -o -name 'gpt-review-*.jsonl' -o -name 'observations-*.jsonl.gz' -o -name 'aggregate_summary.json' \) -print)
          tar -czf "$BUNDLE" $FILES
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "HISTORY_TAG=harvest-history-$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Persist canonical and immutable cycle bundle to Releases
        run: |
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag harvest-state --file canonical/hospitality-canonical.sqlite
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag "$HISTORY_TAG" --file "$BUNDLE"
      - name: Commit small checkpoint / coverage / GPT state
        run: |
          if [ -f state/provider_capacity.json ]; then
            cp state/provider_capacity.json state/hospitality_provider_capacity.json
            git checkout -- state/provider_capacity.json || true
          fi
          git config user.name "ai-prod-harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            state/coverage.json \
            state/checkpoints.json \
            state/source_state.json \
            state/hospitality_provider_capacity.json \
            state/hospitality_scheduler.json \
            metrics/latest.json \
            metrics/history.jsonl \
            gpt/latest_summary.json \
            gpt/pending_batches.json
          if git diff --cached --quiet; then
            echo "No small-state changes to commit"
            exit 0
          fi
          git commit -m "fleet: hospitality unified checkpoint ${CYCLE_ID} [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Failed to persist Git small state after retries" >&2
          exit 1

  release_capacity_lease:
    needs: [plan, harvest, aggregate]
    if: always()
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release account-wide GitHub capacity lease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python tools/global_capacity_broker.py release --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY"

  idle:
    needs: plan
    if: needs.plan.outputs.enabled != 'true' || needs.plan.outputs.worker_count == '0'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hospitality fleet idle: enabled=${{ needs.plan.outputs.enabled }}, workers=${{ needs.plan.outputs.worker_count }}"
