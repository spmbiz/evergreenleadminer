name: Temporary Sheet Sync Export 017-026

on:
  push:
    paths:
      - '.github/workflows/tmp-sheet-sync-export-017-026.yml'

permissions:
  contents: read

env:
  QUEUE_DIR: gpt/sheet_sync_queue

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage oldest requested queue chunks
        run: |
          set -euo pipefail
          mkdir -p export
          for n in $(seq -w 17 26); do
            f="$QUEUE_DIR/bootstrap-20260815T011144Z-${n}.jsonl"
            test -f "$f"
            cp "$f" export/
          done
          sha256sum export/* > export/SHA256SUMS.txt
          wc -l export/*.jsonl > export/LINE_COUNTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-queue-017-026
          path: export/
          retention-days: 1
          compression-level: 6
