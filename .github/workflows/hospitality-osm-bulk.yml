name: Hospitality OSM Bulk Harvest

on:
  push:
    branches: [main]
    paths:
      - 'BULK_HOSPITALITY_TRIGGER.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hospitality-osm-bulk
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_candidates: ${{ steps.plan.outputs.max_candidates }}
      max_enrich: ${{ steps.plan.outputs.max_enrich }}
      workers: ${{ steps.plan.outputs.workers }}
      run_name: ${{ steps.plan.outputs.run_name }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg=json.load(open('BULK_HOSPITALITY_TRIGGER.json',encoding='utf-8'))
          shards=list(cfg.get('shards') or [])
          if cfg.get('preset') == 'americas':
              us = '''alabama alaska arizona arkansas colorado connecticut delaware district-of-columbia florida georgia hawaii idaho illinois indiana iowa kansas kentucky louisiana maine maryland massachusetts michigan minnesota mississippi missouri montana nebraska nevada new-hampshire new-jersey new-mexico new-york north-carolina north-dakota ohio oklahoma oregon pennsylvania puerto-rico rhode-island south-carolina south-dakota tennessee texas us-virgin-islands utah vermont virginia washington west-virginia wisconsin wyoming'''.split()
              ca = '''alberta british-columbia manitoba new-brunswick newfoundland-and-labrador northwest-territories nova-scotia nunavut ontario prince-edward-island quebec saskatchewan yukon'''.split()
              central = '''bahamas belize costa-rica cuba el-salvador guatemala haiti-and-domrep honduras jamaica nicaragua panama'''.split()
              south = '''argentina bolivia brazil chile colombia ecuador guyana paraguay peru suriname uruguay venezuela'''.split()
              for s in us:
                  shards.append({'name':'us-'+s,'country':'USA','region':s.replace('-',' ').title(),'url':f'https://download.geofabrik.de/north-america/us/{s}-latest.osm.pbf'})
              # California is split for runner efficiency.
              shards += [
                  {'name':'us-california-socal','country':'USA','region':'Southern California','url':'https://download.geofabrik.de/north-america/us/california/socal-latest.osm.pbf'},
                  {'name':'us-california-norcal','country':'USA','region':'Northern California','url':'https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf'}]
              for s in ca:
                  shards.append({'name':'canada-'+s,'country':'Canada','region':s.replace('-',' ').title(),'url':f'https://download.geofabrik.de/north-america/canada/{s}-latest.osm.pbf'})
              shards.append({'name':'mexico','country':'Mexico','region':'Mexico','url':'https://download.geofabrik.de/north-america/mexico-latest.osm.pbf'})
              for s in central:
                  country='Haiti / Dominican Republic' if s=='haiti-and-domrep' else s.replace('-',' ').title()
                  shards.append({'name':'central-'+s,'country':country,'region':country,'url':f'https://download.geofabrik.de/central-america/{s}-latest.osm.pbf'})
              for s in south:
                  country=s.title()
                  shards.append({'name':'south-'+s,'country':country,'region':country,'url':f'https://download.geofabrik.de/south-america/{s}-latest.osm.pbf'})
          # de-dupe shard names while preserving order
          uniq=[]; seen=set()
          for x in shards:
              if x['name'] in seen: continue
              seen.add(x['name']); uniq.append(x)
          shards=uniq
          if not shards: raise SystemExit('No shards configured')
          print('matrix='+json.dumps({'include':shards},separators=(',',':')))
          print('max_candidates='+str(int(cfg.get('max_candidates_per_shard',30000))))
          print('max_enrich='+str(int(cfg.get('max_enrich_per_shard',3500))))
          print('workers='+str(int(cfg.get('workers',36))))
          print('run_name='+str(cfg.get('run_name','bulk-hospitality')))
          PY

  harvest:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download Geofabrik shard
        env:
          PBF_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --speed-time 60 --speed-limit 1024 -o work/input.osm.pbf "$PBF_URL"
      - name: Bulk extract and enrich public hospitality leads
        env:
          COUNTRY: ${{ matrix.country }}
          REGION: ${{ matrix.region }}
          SHARD_NAME: ${{ matrix.name }}
          MAX_CANDIDATES: ${{ needs.plan.outputs.max_candidates }}
          MAX_ENRICH: ${{ needs.plan.outputs.max_enrich }}
          WORKERS: ${{ needs.plan.outputs.workers }}
        run: |
          set -o pipefail
          mkdir -p "results/$SHARD_NAME"
          python tools/osm_pbf_hospitality_harvest.py --pbf work/input.osm.pbf --outdir "results/$SHARD_NAME" --country "$COUNTRY" --region "$REGION" --max-candidates "$MAX_CANDIDATES" --max-enrich "$MAX_ENRICH" --workers "$WORKERS" 2>&1 | tee "results/$SHARD_NAME/harvest.log"
      - name: Apply high-precision luxury property gate v3
        env:
          SHARD_NAME: ${{ matrix.name }}
          WORKERS: ${{ needs.plan.outputs.workers }}
        run: |
          set -o pipefail
          python tools/premium_property_filter_v3.py --input "results/$SHARD_NAME/candidates_all.csv" --outdir "results/$SHARD_NAME" --workers "$WORKERS" --max-web-checks 0 2>&1 | tee "results/$SHARD_NAME/premium_v3_gate.log"
      - name: Show summaries
        if: always()
        env:
          SHARD_NAME: ${{ matrix.name }}
        run: |
          test ! -f "results/$SHARD_NAME/summary.json" || cat "results/$SHARD_NAME/summary.json"
          test ! -f "results/$SHARD_NAME/premium_v3_summary.json" || cat "results/$SHARD_NAME/premium_v3_summary.json"
      - name: Upload lead artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-${{ needs.plan.outputs.run_name }}-${{ matrix.name }}
          path: |
            results/${{ matrix.name }}/candidates_all.csv
            results/${{ matrix.name }}/candidates_with_website.csv
            results/${{ matrix.name }}/candidates_with_public_email.csv
            results/${{ matrix.name }}/premium_v3_all_scored.csv
            results/${{ matrix.name }}/premium_v3_selected.csv
            results/${{ matrix.name }}/premium_v3_master_ready.csv
            results/${{ matrix.name }}/premium_v3_rejected.csv
            results/${{ matrix.name }}/summary.json
            results/${{ matrix.name }}/premium_v3_summary.json
            results/${{ matrix.name }}/harvest.log
            results/${{ matrix.name }}/premium_v3_gate.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
