name: GWS Redteam Exact3 Source Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gws-redteam-exact3-source-website.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gws-redteam-exact3-source-website
  cancel-in-progress: true

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact production verifier dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests 'ddgs>=9,<10' aiohttp
      - name: Start hosted OpenSERP or use exclusion-only fallback
        id: openserp
        shell: bash
        run: |
          set +e
          if bash tools/start_openserp_ci.sh; then
            echo 'url=http://127.0.0.1:7000' >> "$GITHUB_OUTPUT"
            echo 'mode=openserp_ci' >> "$GITHUB_OUTPUT"
          else
            echo 'url=' >> "$GITHUB_OUTPUT"
            echo 'mode=fallback_search_fabric' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Refresh current Overture identity and source websites for exact prior HIGHs
        run: |
          set -euo pipefail
          mkdir -p results/gws_redteam_exact3
          python tools/gws_pending_verify_worker.py \
            --input gpt/gws_redteam/source_website_p0_exact3_20260817.jsonl \
            --worker-index 0 \
            --worker-count 1 \
            --outdir results/gws_redteam_exact3 \
            --threads 8
          test "$(grep -cve '^$' results/gws_redteam_exact3/records.jsonl)" -eq 3
      - name: Re-run exact production source-safe two-pass verification
        env:
          OPENSERP_URL: ${{ steps.openserp.outputs.url }}
        run: |
          set -euo pipefail
          python tools/gws_search_verify_source_safe.py \
            --shard-dir results/gws_redteam_exact3 \
            --config config/gws_search_verify.json
      - name: Assert known false HIGH can never remain HIGH and summarize all three
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('results/gws_redteam_exact3/records.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          report=[]
          for r in rows:
              check=r.get('source_website_precheck') or {}
              report.append({
                'business':r.get('hub_name'),
                'record_key':r.get('record_key'),
                'status':r.get('verification_status'),
                'outcome':r.get('outcome'),
                'reason':r.get('reason'),
                'overture_websites':r.get('overture_websites'),
                'source_precheck_status':check.get('status'),
                'source_precheck_events':[{
                    'url':e.get('url'),'final':e.get('final'),'status':e.get('status'),
                    'ok':e.get('ok'),'assessment_reason':(e.get('assessment') or {}).get('reason'),
                    'assessment_confident':(e.get('assessment') or {}).get('confident')
                } for e in check.get('events') or []],
                'certificate_verified':bool((r.get('certificate') or {}).get('verified')),
                'high_challenge_status':(r.get('final_high_challenge') or {}).get('status'),
              })
          Path('results/gws_redteam_exact3/redteam_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('GWS_REDTEAM_EXACT3='+json.dumps(report,ensure_ascii=False,separators=(',',':')))
          kooples=next(x for x in report if x['business']=='The Kooples')
          if kooples['status']=='HIGH':
              raise SystemExit('P0 REGRESSION: The Kooples remained HIGH despite source website')
          PY
          cat results/gws_redteam_exact3/redteam_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-redteam-exact3-${{ github.run_id }}
          path: results/gws_redteam_exact3/
          retention-days: 3
          compression-level: 6
