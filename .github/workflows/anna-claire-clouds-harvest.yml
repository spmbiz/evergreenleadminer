name: Anna Claire Clouds IMDb scene still harvest

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt
      - name: Harvest IMDb filmography media stills and posters
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "300"
        run: python imdb_scene_300.py
      - name: Report count
        working-directory: tools/anna_claire_clouds_harvest
        run: echo "Collected $(cat IMDB300_COUNT.txt 2>/dev/null || echo 0)"
      - name: Upload IMDb ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-imdb-scene-300
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_imdb_scene_300.zip
            tools/anna_claire_clouds_harvest/IMDB300_COUNT.txt
          if-no-files-found: error
          retention-days: 7
