name: Anna Claire Clouds 300-image curation pool

on:
  push:
    branches:
      - anna-claire-clouds-curated-300
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt

      - name: Harvest 300 public TikTok stills
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "300"
        run: |
          set +e
          python run_urlebird_fixed.py
          echo "harvest_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Report collection count
        working-directory: tools/anna_claire_clouds_harvest
        run: |
          echo "Collected: $(cat COLLECTION_COUNT.txt 2>/dev/null || echo 0)"
          echo "Harvester exit: $harvest_exit"

      - name: Upload curation pool and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-300-image-curation-pool
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_200_public_tiktok_stills.zip
            tools/anna_claire_clouds_harvest/COLLECTION_COUNT.txt
            tools/anna_claire_clouds_harvest/logs/
          if-no-files-found: warn
          retention-days: 7
