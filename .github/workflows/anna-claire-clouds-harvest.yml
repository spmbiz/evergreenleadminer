name: Anna Claire Clouds official social photo harvest

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt

      - name: Harvest official public social images
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "200"
        run: |
          set +e
          python social_harvest.py
          echo "harvest_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Report collection count
        working-directory: tools/anna_claire_clouds_harvest
        run: |
          echo "Collected: $(cat COLLECTION_COUNT.txt 2>/dev/null || echo 0)"
          echo "Harvester exit: $harvest_exit"

      - name: Upload official-photo artifact and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-official-public-photos
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_200_official_public_photos.zip
            tools/anna_claire_clouds_harvest/COLLECTION_COUNT.txt
            tools/anna_claire_clouds_harvest/logs/
          if-no-files-found: warn
          retention-days: 7
