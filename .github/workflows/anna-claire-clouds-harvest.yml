name: Anna Claire Clouds targeted editorial harvest

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt
      - name: Harvest exact-match editorial, interview and event images
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "200"
        run: python targeted_harvest.py
      - name: Write count
        working-directory: tools/anna_claire_clouds_harvest
        run: |
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path('targeted_output/manifest.csv')
          n=sum(1 for _ in csv.DictReader(p.open(encoding='utf-8-sig'))) if p.exists() else 0
          pathlib.Path('TARGETED_COUNT.txt').write_text(str(n))
          print(f'Collected {n}')
          PY
      - name: Upload targeted ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-targeted-public-photos
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_targeted_public_photos.zip
            tools/anna_claire_clouds_harvest/TARGETED_COUNT.txt
          if-no-files-found: error
          retention-days: 7
