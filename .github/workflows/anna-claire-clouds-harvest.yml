name: Anna Claire Clouds fast POV harvest

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt
      - name: Harvest exact-query POV thumbnails fast
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "200"
        run: python google_pov_fast.py
      - name: Report count
        working-directory: tools/anna_claire_clouds_harvest
        run: echo "Collected $(cat POV_FAST_COUNT.txt 2>/dev/null || echo 0)"
      - name: Upload fast POV ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-pov-fast
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_pov_fast.zip
            tools/anna_claire_clouds_harvest/POV_FAST_COUNT.txt
          if-no-files-found: error
          retention-days: 7
