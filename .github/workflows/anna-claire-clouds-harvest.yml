name: Anna Claire Clouds real Google POV results

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r tools/anna_claire_clouds_harvest/requirements.txt
          pip install playwright==1.52.0
          which google-chrome || which google-chrome-stable || true
      - name: Capture actual Google Images POV result thumbnails
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "200"
        run: python google_dom_screenshots.py
      - name: Report count
        working-directory: tools/anna_claire_clouds_harvest
        run: echo "Collected $(cat GOOGLE_DOM_COUNT.txt 2>/dev/null || echo 0)"
      - name: Upload real Google result ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-google-pov-real-results
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_google_pov_real_results.zip
            tools/anna_claire_clouds_harvest/GOOGLE_DOM_COUNT.txt
          if-no-files-found: error
          retention-days: 7
