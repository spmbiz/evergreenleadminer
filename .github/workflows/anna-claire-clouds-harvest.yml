name: Anna Claire Clouds uncropped scene preview harvest

on:
  push:
    branches:
      - anna-claire-clouds-harvest
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/anna_claire_clouds_harvest/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/anna_claire_clouds_harvest/requirements.txt
      - name: Download uncropped original scene and trailer previews
        working-directory: tools/anna_claire_clouds_harvest
        env:
          TARGET_COUNT: "300"
        run: python original_scene_previews.py
      - name: Report count
        working-directory: tools/anna_claire_clouds_harvest
        run: echo "Collected $(cat UNCROPPED_COUNT.txt 2>/dev/null || echo 0)"
      - name: Upload uncropped preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anna-claire-clouds-uncropped-scene-previews
          path: |
            tools/anna_claire_clouds_harvest/anna_claire_clouds_uncropped_scene_previews.zip
            tools/anna_claire_clouds_harvest/UNCROPPED_COUNT.txt
          if-no-files-found: error
          retention-days: 7
