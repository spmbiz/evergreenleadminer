name: GWS Overture First Volume

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gws_brussels_overture_first.py'
      - '.github/workflows/gws-overture-first-volume.yml'

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Materialize Overture-first Brussels pool
        run: |
          set -o pipefail
          python tools/gws_brussels_overture_first.py 2>&1 | tee gws-overture-first.log
      - name: Show summary
        if: always()
        run: test ! -f results/gws_brussels_overture_first/summary.json || cat results/gws_brussels_overture_first/summary.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gws-overture-first-volume
          path: |
            results/gws_brussels_overture_first/
            gws-overture-first.log
          compression-level: 6
          retention-days: 7
