name: Hospitality Intelligence V2

on:
  schedule:
    - cron: '11 1,9,17 * * *'
  push:
    branches: [main]
    paths:
      - 'control/hospitality_intelligence_trigger*.json'
  workflow_dispatch:
    inputs:
      force_reclassify:
        description: 'Reclassify current canonical accounts even if unchanged (normally false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: hospitality-intelligence-v2
  cancel-in-progress: false

env:
  INTEL_CONFIG: config/hospitality_intelligence_v2.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      enabled: ${{ steps.emit.outputs.enabled }}
      matrix: ${{ steps.emit.outputs.matrix }}
      worker_count: ${{ steps.emit.outputs.worker_count }}
      accounts_planned: ${{ steps.emit.outputs.accounts_planned }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore canonical and intelligence ledgers
        run: |
          set -euo pipefail
          mkdir -p snapshot intelligence_plan
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-canonical.sqlite' \
            --dir snapshot \
            --clobber
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-intelligence.sqlite' \
            --dir snapshot \
            --clobber || true
      - name: Build NEW / CHANGED / unresolved semantic queue
        env:
          FORCE: ${{ github.event.inputs.force_reclassify || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(
            --canonical-db snapshot/hospitality-canonical.sqlite
            --intelligence-db snapshot/hospitality-intelligence.sqlite
            --config "$INTEL_CONFIG"
            --outdir intelligence_plan
          )
          if [ "${FORCE,,}" = "true" ]; then ARGS+=(--force); fi
          python tools/hospitality_intelligence_plan.py "${ARGS[@]}"
      - id: emit
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('intelligence_plan/plan.json'))
          print('enabled='+str(bool(p.get('enabled'))).lower())
          print('matrix='+json.dumps({'include':p.get('include') or []},separators=(',',':')))
          print('worker_count='+str(int(p.get('worker_count') or 0)))
          print('accounts_planned='+str(int(p.get('accounts_planned') or 0)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: intelligence_plan/
          retention-days: 1
          compression-level: 6

  prepare_model:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read pinned Qwen model config
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('config/hospitality_intelligence_v2.json'))['qwen']
          print('repo='+q['model_repo'])
          print('revision='+q['model_revision'])
          print('file='+q['model_file'])
          PY
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ steps.model.outputs.revision }}
      - name: Download pinned official Qwen GGUF once per cache generation
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          MODEL_REPO: ${{ steps.model.outputs.repo }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<1.0'
          mkdir -p model_cache
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(repo_id=os.environ['MODEL_REPO'], filename=os.environ['MODEL_FILE'], revision=os.environ['MODEL_REVISION'], local_dir='model_cache')
          print(p)
          PY
      - name: Verify model payload
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: |
          set -euo pipefail
          test -s "model_cache/$MODEL_FILE"
          ls -lh "model_cache/$MODEL_FILE"

  intelligence:
    needs: [plan, prepare_model]
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight worker dependencies
        run: python -m pip install --disable-pip-version-check requests ddgs
      - uses: actions/cache@v4
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ matrix.model_revision }}
          fail-on-cache-miss: true
      - name: Download Intelligence plan
        uses: actions/download-artifact@v4
        with:
          name: hospitality-intelligence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: intelligence_plan
      - name: Start local Qwen server
        env:
          MODEL_FILE: ${{ matrix.model_file }}
        run: |
          set -euo pipefail
          bash tools/start_qwen4b_ci.sh "model_cache/$MODEL_FILE" qwen_runtime
      - name: Start local OpenSERP when available
        continue-on-error: true
        run: bash tools/start_openserp_ci.sh openserp_runtime
      - name: Run account intelligence shard
        env:
          OPENAI_BASE_URL: http://127.0.0.1:8080/v1
          OPENAI_API_KEY: local-qwen
          OPENSERP_URL: http://127.0.0.1:7000
        run: |
          set -euo pipefail
          mkdir -p "results/${{ matrix.key }}"
          python tools/hospitality_intelligence_worker.py \
            --input "intelligence_plan/${{ matrix.input_file }}" \
            --config "$INTEL_CONFIG" \
            --outdir "results/${{ matrix.key }}" \
            --worker-key "${{ matrix.key }}"
      - name: Upload intelligence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-worker-${{ github.run_id }}-${{ matrix.key }}
          path: results/${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6

  aggregate:
    needs: [plan, intelligence]
    if: always() && needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    concurrency:
      group: hospitality-canonical-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      INTEL_CYCLE_ID: intel-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download plan and intelligence worker partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hospitality-intelligence-*
          path: incoming
      - name: Restore newest canonical and intelligence state under writer lock
        run: |
          set -euo pipefail
          mkdir -p canonical aggregate_out
          gh release download harvest-state --repo "$GITHUB_REPOSITORY" --pattern 'hospitality-canonical.sqlite' --dir canonical --clobber
          gh release download harvest-state --repo "$GITHUB_REPOSITORY" --pattern 'hospitality-intelligence.sqlite' --dir canonical --clobber || true
      - name: Aggregate account + asset intelligence ledger
        run: |
          set -euo pipefail
          python tools/hospitality_intelligence_aggregate.py \
            --results-root incoming \
            --canonical-db canonical/hospitality-canonical.sqlite \
            --intelligence-db canonical/hospitality-intelligence.sqlite \
            --cycle-id "$INTEL_CYCLE_ID" \
            --outdir aggregate_out
      - name: Apply first-party fill-only intelligence delta to canonical
        run: |
          set -euo pipefail
          python tools/apply_hospitality_intelligence_delta.py \
            --canonical-db canonical/hospitality-canonical.sqlite \
            --delta aggregate_out/canonical-fill-delta.jsonl.gz \
            --out-summary aggregate_out/canonical-fill-summary.json
      - name: Persist canonical and intelligence ledgers
        run: |
          set -euo pipefail
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag harvest-state --file canonical/hospitality-canonical.sqlite
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag harvest-state --file canonical/hospitality-intelligence.sqlite
      - name: Preserve intelligence audit bundle
        run: |
          set -euo pipefail
          tar -czf "aggregate_out/hospitality-intelligence-${INTEL_CYCLE_ID}.tar.gz" aggregate_out/intelligence-summary.json aggregate_out/canonical-fill-summary.json aggregate_out/gpt-review.jsonl aggregate_out/canonical-fill-delta.jsonl.gz
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag "harvest-history-$(date -u +%F)" --file "aggregate_out/hospitality-intelligence-${INTEL_CYCLE_ID}.tar.gz"
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate_out/
          retention-days: 3
          compression-level: 6
