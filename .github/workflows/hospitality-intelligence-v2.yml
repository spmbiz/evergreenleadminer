name: Hospitality Intelligence V2

on:
  schedule:
    - cron: '11 1,9,17 * * *'
  push:
    branches: [main]
    paths:
      - 'control/hospitality_intelligence_trigger*.json'
  workflow_dispatch:
    inputs:
      force_reclassify:
        description: 'Reclassify current canonical accounts even if unchanged (normally false)'
        required: false
        default: 'false'
      max_accounts:
        description: 'Optional one-run account cap for smoke testing; 0 uses config'
        required: false
        default: '0'
      max_workers:
        description: 'Optional one-run worker cap for smoke testing; 0 uses config'
        required: false
        default: '0'

permissions:
  contents: write
  actions: read

concurrency:
  group: hospitality-intelligence-v2
  cancel-in-progress: false

env:
  INTEL_CONFIG: config/hospitality_intelligence_v2.json

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      enabled: ${{ steps.emit.outputs.enabled }}
      matrix: ${{ steps.emit.outputs.matrix }}
      worker_count: ${{ steps.emit.outputs.worker_count }}
      accounts_planned: ${{ steps.emit.outputs.accounts_planned }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore canonical and intelligence ledgers
        run: |
          set -euo pipefail
          mkdir -p snapshot intelligence_plan
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-canonical.sqlite' \
            --dir snapshot \
            --clobber
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-intelligence.sqlite' \
            --dir snapshot \
            --clobber || true
      - name: Build NEW / CHANGED / unresolved semantic queue
        env:
          FORCE_INPUT: ${{ github.event.inputs.force_reclassify || 'false' }}
          MAX_ACCOUNTS_INPUT: ${{ github.event.inputs.max_accounts || '0' }}
          MAX_WORKERS_INPUT: ${{ github.event.inputs.max_workers || '0' }}
        run: |
          set -euo pipefail
          FORCE="$FORCE_INPUT"
          MAX_ACCOUNTS="$MAX_ACCOUNTS_INPUT"
          MAX_WORKERS="$MAX_WORKERS_INPUT"

          # Push-trigger smoke controls are carried in the newest trigger JSON.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TRIGGER=$(find control -maxdepth 1 -type f -name 'hospitality_intelligence_trigger*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)
            if [ -n "$TRIGGER" ]; then
              FORCE=$(python -c "import json; d=json.load(open('$TRIGGER')); print(str(bool(d.get('force_reclassify',False))).lower())")
              MAX_ACCOUNTS=$(python -c "import json; d=json.load(open('$TRIGGER')); print(int(d.get('max_accounts') or 0))")
              MAX_WORKERS=$(python -c "import json; d=json.load(open('$TRIGGER')); print(int(d.get('max_workers') or 0))")
              echo "Trigger overrides: file=$TRIGGER force=$FORCE max_accounts=$MAX_ACCOUNTS max_workers=$MAX_WORKERS"
            fi
          fi

          ARGS=(
            --canonical-db snapshot/hospitality-canonical.sqlite
            --intelligence-db snapshot/hospitality-intelligence.sqlite
            --config "$INTEL_CONFIG"
            --outdir intelligence_plan
          )
          if [ "${FORCE,,}" = "true" ]; then ARGS+=(--force); fi
          if [ "${MAX_ACCOUNTS:-0}" -gt 0 ]; then ARGS+=(--max-accounts "$MAX_ACCOUNTS"); fi
          if [ "${MAX_WORKERS:-0}" -gt 0 ]; then ARGS+=(--max-workers "$MAX_WORKERS"); fi
          python tools/hospitality_intelligence_plan.py "${ARGS[@]}"
      - id: emit
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('intelligence_plan/plan.json'))
          print('enabled='+str(bool(p.get('enabled'))).lower())
          print('matrix='+json.dumps({'include':p.get('include') or []},separators=(',',':')))
          print('worker_count='+str(int(p.get('worker_count') or 0)))
          print('accounts_planned='+str(int(p.get('accounts_planned') or 0)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: intelligence_plan/
          retention-days: 1
          compression-level: 6

  prepare_model:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      model_revision: ${{ steps.model.outputs.revision }}
      model_file: ${{ steps.model.outputs.file }}
      model_image: ${{ steps.model.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read pinned Qwen model config
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('config/hospitality_intelligence_v2.json'))['qwen']
          print('repo='+q['model_repo'])
          print('revision='+q['model_revision'])
          print('file='+q['model_file'])
          print('image='+q.get('llama_cpp_image','ghcr.io/ggml-org/llama.cpp:server'))
          PY
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ steps.model.outputs.revision }}
      - name: Download pinned official Qwen GGUF once per cache generation
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          MODEL_REPO: ${{ steps.model.outputs.repo }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
          mkdir -p model_cache
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(repo_id=os.environ['MODEL_REPO'], filename=os.environ['MODEL_FILE'], revision=os.environ['MODEL_REVISION'], local_dir='model_cache')
          print(p)
          PY
      - name: Verify model payload and exported outputs
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
        run: |
          set -euo pipefail
          test -n "$MODEL_FILE"
          test -n "$MODEL_REVISION"
          test -s "model_cache/$MODEL_FILE"
          SIZE=$(stat -c%s "model_cache/$MODEL_FILE")
          test "$SIZE" -gt 1000000000
          ls -lh "model_cache/$MODEL_FILE"

  intelligence:
    needs: [plan, prepare_model]
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight worker dependencies
        run: python -m pip install --disable-pip-version-check requests 'ddgs>=9,<10'
      - uses: actions/cache@v4
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ needs.prepare_model.outputs.model_revision }}
          fail-on-cache-miss: true
      - name: Download Intelligence plan
        uses: actions/download-artifact@v4
        with:
          name: hospitality-intelligence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: intelligence_plan
      - name: Validate worker wiring
        env:
          MODEL_FILE: ${{ needs.prepare_model.outputs.model_file }}
          SHARD_FILE: ${{ matrix.path }}
          SHARD_ID: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          test -n "$MODEL_FILE"
          test -n "$SHARD_FILE"
          test -n "$SHARD_ID"
          test -s "model_cache/$MODEL_FILE"
          test -s "intelligence_plan/$SHARD_FILE"
          python tools/hospitality_intelligence_worker.py --help | grep -q -- '--shard'
          python tools/hospitality_intelligence_worker.py --help | grep -q -- '--qwen-url'
          echo "Qwen=$MODEL_FILE shard=$SHARD_ID input=$SHARD_FILE"
      - name: Start local Qwen server fail-open
        env:
          MODEL_FILE: ${{ needs.prepare_model.outputs.model_file }}
          LLAMA_CPP_IMAGE: ${{ needs.prepare_model.outputs.model_image }}
        run: |
          set +e
          if bash tools/start_qwen4b_ci.sh "$PWD/model_cache" "$MODEL_FILE"; then
            echo 'QWEN_URL=http://127.0.0.1:8080' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=ready' >> "$GITHUB_ENV"
          else
            echo 'QWEN_URL=http://127.0.0.1:65534' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=unavailable_fail_open' >> "$GITHUB_ENV"
            echo 'Qwen runtime unavailable; worker will preserve records as MAYBE/QWEN_UNAVAILABLE.'
          fi
          exit 0
      - name: Start local OpenSERP fail-open to DDGS
        run: |
          set +e
          if bash tools/start_openserp_ci.sh; then
            echo 'OPENSERP_URL=http://127.0.0.1:7000' >> "$GITHUB_ENV"
            echo 'OPENSERP_RUNTIME=ready' >> "$GITHUB_ENV"
          else
            echo 'OPENSERP_URL=' >> "$GITHUB_ENV"
            echo 'OPENSERP_RUNTIME=unavailable_ddgs_fallback' >> "$GITHUB_ENV"
            echo 'OpenSERP unavailable; worker will continue through DDGS fallback.'
          fi
          exit 0
      - name: Run account intelligence shard
        run: |
          set -euo pipefail
          OUT="worker_out/${{ matrix.shard }}"
          mkdir -p "$OUT"
          python tools/hospitality_intelligence_worker.py \
            --input "intelligence_plan/${{ matrix.path }}" \
            --config "$INTEL_CONFIG" \
            --qwen-url "$QWEN_URL" \
            --shard "${{ matrix.shard }}" \
            --outdir "$OUT"
          test -s "$OUT/accounts.jsonl.gz"
          test -s "$OUT/summary.json"
      - name: Upload intelligence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-worker-${{ github.run_id }}-${{ matrix.shard }}
          path: worker_out/${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6

  aggregate_intelligence:
    needs: [plan, intelligence]
    if: always() && needs.plan.outputs.enabled == 'true' && needs.plan.outputs.worker_count != '0'
    concurrency:
      group: hospitality-intelligence-ledger-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      INTEL_CYCLE_ID: intel-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download intelligence worker partitions
        uses: actions/download-artifact@v4
        with:
          pattern: hospitality-intelligence-worker-${{ github.run_id }}-*
          path: worker_results
      - name: Restore latest intelligence ledger if present
        run: |
          set -euo pipefail
          mkdir -p intelligence aggregate_out
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-intelligence.sqlite' \
            --dir intelligence \
            --clobber || true
      - name: Validate aggregate CLI contract
        run: |
          set -euo pipefail
          python tools/hospitality_intelligence_aggregate.py --help | grep -q -- '--results-root'
          python tools/hospitality_intelligence_aggregate.py --help | grep -q -- '--intelligence-db'
          python tools/hospitality_intelligence_aggregate.py --help | grep -q -- '--run-id'
          python tools/hospitality_intelligence_aggregate.py --help | grep -q -- '--outdir'
      - name: Aggregate account + asset intelligence ledger
        run: |
          set -euo pipefail
          python tools/hospitality_intelligence_aggregate.py \
            --results-root worker_results \
            --intelligence-db intelligence/hospitality-intelligence.sqlite \
            --run-id "$INTEL_CYCLE_ID" \
            --outdir aggregate_out
          test -s aggregate_out/summary.json
          test -f aggregate_out/canonical-intelligence-delta.jsonl.gz
          test -f aggregate_out/gpt-review.jsonl
      - name: Persist intelligence SQLite and immutable review bundle
        run: |
          set -euo pipefail
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag harvest-state --file intelligence/hospitality-intelligence.sqlite
          BUNDLE="aggregate_out/hospitality-intelligence-${INTEL_CYCLE_ID}.tar.gz"
          tar -czf "$BUNDLE" -C aggregate_out summary.json gpt-review.jsonl canonical-intelligence-delta.jsonl.gz
          python tools/fleet_runtime.py upload --repo "$GITHUB_REPOSITORY" --tag "harvest-history-$(date -u +%F)" --file "$BUNDLE"
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate_out/
          retention-days: 3
          compression-level: 6

  merge_canonical_fill_only:
    needs: [plan, aggregate_intelligence]
    if: needs.aggregate_intelligence.result == 'success'
    concurrency:
      group: hospitality-canonical-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hospitality-intelligence-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate_out
      - name: Restore newest canonical under writer lock
        run: |
          set -euo pipefail
          mkdir -p canonical merge_out
          gh release download harvest-state \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hospitality-canonical.sqlite' \
            --dir canonical \
            --clobber
      - name: Apply first-party fill-only intelligence delta
        run: |
          set -euo pipefail
          test -f aggregate_out/canonical-intelligence-delta.jsonl.gz
          python tools/apply_hospitality_intelligence_delta.py \
            --canonical-db canonical/hospitality-canonical.sqlite \
            --delta aggregate_out/canonical-intelligence-delta.jsonl.gz \
            --out-summary merge_out/summary.json
          test -s merge_out/summary.json
      - name: Persist enriched canonical
        run: |
          set -euo pipefail
          python tools/fleet_runtime.py upload \
            --repo "$GITHUB_REPOSITORY" --tag harvest-state \
            --file canonical/hospitality-canonical.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-intelligence-canonical-merge-${{ github.run_id }}
          path: merge_out/
          retention-days: 3
          compression-level: 6
