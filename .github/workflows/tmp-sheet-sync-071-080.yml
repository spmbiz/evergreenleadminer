name: TMP Sheet Sync 071-080
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sheet-sync-071-080.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage exact queue chunks
        run: |
          set -euo pipefail
          mkdir payload
          for n in 071 072 073 074 075 076 077 078 079 080; do
            cp "gpt/sheet_sync_queue/bootstrap-20260815T011144Z-${n}.jsonl" payload/
          done
          sha256sum payload/* > payload/SHA256SUMS.txt
          wc -l payload/*.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-071-080
          path: payload/
          retention-days: 1
          compression-level: 6
