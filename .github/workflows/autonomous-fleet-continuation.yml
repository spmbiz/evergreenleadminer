name: Autonomous Fleet Continuation

on:
  workflow_run:
    workflows:
      - Hospitality Autonomous Fleet 24/7
      - GWS Autonomous Harvest Fleet
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-prod-fleet-continuation
  cancel-in-progress: false

jobs:
  refill_all_useful_workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute both local backlogs after every natural completion
        run: |
          set -euo pipefail
          python tools/hospitality_master_plan.py \
            --provider github --capacity 1 --out /tmp/hospitality-plan.json >/dev/null
          python - <<'PY' >/tmp/demand.json
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import global_capacity_broker as broker
          desired=json.load(open('control/desired_state.json'))
          hp=json.load(open('/tmp/hospitality-plan.json'))
          d=broker._effective_local_demand()
          print(json.dumps({
              'enabled': bool(desired.get('enabled')) and bool(desired.get('continuous', True)),
              'hospitality': int(hp.get('useful_backlog') or 0),
              'gws': int(d.get('gws') or 0),
              'tenders': int(d.get('tenders') or 0),
              'hospitality_lanes': hp.get('lane_backlog') or {},
          }))
          PY
          cat /tmp/demand.json

      - name: Refill whichever local workload is idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENABLED=$(python -c 'import json; print("true" if json.load(open("/tmp/demand.json"))["enabled"] else "false")')
          [ "$ENABLED" = "true" ] || { echo "Continuous fleet disabled."; exit 0; }

          dispatch_if_idle () {
            local workflow_file="$1"
            local backlog="$2"
            local label="$3"
            [ "$backlog" -gt 0 ] || { echo "$label backlog empty; share borrowable."; return 0; }
            local active
            active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
            if [ "$active" -gt 0 ]; then
              echo "$label already active/queued=$active"
              return 0
            fi
            if [ "$workflow_file" = "hospitality-autonomous-fleet.yml" ]; then
              printf '%s\n' '{"ref":"main","inputs":{"force_workers":"0"}}' | \
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
                  --input -
            else
              printf '%s\n' '{"ref":"main"}' | \
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
                  --input -
            fi
            echo "Redispatched $label immediately for backlog=$backlog"
          }

          HOSP=$(python -c 'import json; print(json.load(open("/tmp/demand.json"))["hospitality"])')
          GWS=$(python -c 'import json; print(json.load(open("/tmp/demand.json"))["gws"])')

          # Evaluate both workloads on every completion. This is what lets freshly
          # freed capacity get claimed by the workload currently below its share.
          dispatch_if_idle hospitality-autonomous-fleet.yml "$HOSP" hospitality
          dispatch_if_idle gws-autonomous-fleet.yml "$GWS" gws

          echo "Long runs are never preempted here; rebalancing happens at natural job completion."
