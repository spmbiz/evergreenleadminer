name: Autonomous Fleet Continuation

on:
  workflow_run:
    workflows:
      - Hospitality Autonomous Fleet 24/7
      - GWS Autonomous Harvest Fleet
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-prod-fleet-continuation
  cancel-in-progress: false

jobs:
  continue_if_useful:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decide whether useful autonomous work remains
        id: decide
        env:
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/decision.json
          import json, os, subprocess
          desired=json.load(open('control/desired_state.json'))
          enabled=bool(desired.get('enabled')) and bool(desired.get('continuous', True))
          workflow=os.environ['COMPLETED_WORKFLOW']
          out={'enabled':enabled,'workflow':workflow,'backlog':0,'dispatch':'','lane_backlog':{}}

          if enabled and workflow == 'Hospitality Autonomous Fleet 24/7':
              subprocess.run([
                  'python','tools/hospitality_multilane_plan.py','--provider','github',
                  '--capacity','1','--out','/tmp/hospitality-plan.json'
              ],check=True,stdout=subprocess.DEVNULL)
              plan=json.load(open('/tmp/hospitality-plan.json'))
              n=int(plan.get('useful_backlog') or 0)
              out['backlog']=n
              out['lane_backlog']=plan.get('lane_backlog') or {}
              if n:
                  out['dispatch']='hospitality-autonomous-fleet.yml'

          elif enabled and workflow == 'GWS Autonomous Harvest Fleet':
              import sys
              from pathlib import Path
              sys.path.insert(0, str(Path('tools').resolve()))
              import global_capacity_broker as broker
              n=int((broker.local_demand() or {}).get('gws') or 0)
              out['backlog']=n
              if n:
                  out['dispatch']='gws-autonomous-fleet.yml'

          print(json.dumps(out))
          PY
          cat /tmp/decision.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/decision.json'))
          print('enabled='+str(bool(d['enabled'])).lower())
          print('backlog='+str(int(d['backlog'])))
          print('dispatch='+str(d['dispatch']))
          print('lane_backlog='+json.dumps(d.get('lane_backlog') or {},separators=(',',':')))
          PY
      - name: Redispatch useful workload immediately
        if: steps.decide.outputs.enabled == 'true' && steps.decide.outputs.backlog != '0' && steps.decide.outputs.dispatch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ${{ steps.decide.outputs.dispatch }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_FILE" = "hospitality-autonomous-fleet.yml" ]; then
            printf '%s\n' '{"ref":"main","inputs":{"force_workers":"0"}}' | \
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
                --input -
          else
            printf '%s\n' '{"ref":"main"}' | \
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
                --input -
          fi
          echo "Redispatched $WORKFLOW_FILE for remaining backlog=${{ steps.decide.outputs.backlog }} lanes=${{ steps.decide.outputs.lane_backlog }}"
      - name: Report idle
        if: steps.decide.outputs.enabled != 'true' || steps.decide.outputs.backlog == '0' || steps.decide.outputs.dispatch == ''
        run: echo "No immediate continuation required. Cron remains the safety heartbeat."
