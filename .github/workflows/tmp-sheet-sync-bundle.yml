name: TMP Sheet Sync Bundle
on:
  push:
    paths:
      - '.github/workflows/tmp-sheet-sync-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle oldest bootstrap queue 083-092
        run: |
          mkdir -p /tmp/queue
          python - <<'PY'
          import glob,shutil,os,re
          files=sorted(glob.glob('gpt/sheet_sync_queue/bootstrap-20260815T011144Z-*.jsonl'))
          chosen=[]
          for q in files:
              b=os.path.basename(q)
              m=re.search(r'-(\d{3})\.jsonl$',b)
              if not m: continue
              n=int(m.group(1))
              if 83 <= n <= 92:
                  shutil.copy2(q,'/tmp/queue/'+b)
                  chosen.append(q)
          print('\n'.join(chosen))
          assert len(chosen)==10, chosen
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-bootstrap-083-092
          path: /tmp/queue/*.jsonl
          retention-days: 1
