name: GWS Autonomous Harvest Fleet

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/desired_state.json'
      - 'config/providers.json'
      - 'config/gws_fleet.json'
      - 'config/gws_sources.json'
      - 'tools/gws_fleet_*.py'
      - 'tools/gws_source_*.py'
      - 'tools/gws_worker_postprocess.py'
      - '.github/workflows/gws-autonomous-fleet.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: autonomous-harvest-fleet
  queue: max

jobs:
  plan:
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Reserve global capacity, lease GWS work, snapshot Hub once
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p results/fleet_plan
          REQUESTED=$(python - <<'PY'
          import json
          try:
              p=json.load(open('state/gws_source_profiles.json')).get('profiles',{}).get('gws_hub_overture',{})
              stable=int(p.get('stable_parallel') or p.get('initial_parallel') or 8)
          except Exception:
              stable=8
          try:
              g=json.load(open('config/global_fleet.json')).get('workloads',{}).get('gws',{})
              cap=int(g.get('max_slots') or 12)
          except Exception:
              cap=12
          print(max(0,min(stable,cap)))
          PY
          )
          python tools/global_capacity_broker.py reserve \
            --workload gws \
            --requested "$REQUESTED" \
            --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY" \
            --out results/fleet_plan/global_broker.json
          ALLOCATED=$(python -c 'import json; print(int(json.load(open("results/fleet_plan/global_broker.json")).get("allocated") or 0))')
          echo "global_broker_requested=$REQUESTED allocated=$ALLOCATED"
          python tools/gws_broker_plan.py --capacity "$ALLOCATED" --outdir results/fleet_plan
      - name: Install discovery dependency
        if: steps.plan.outputs.selected_count != '0'
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Prepare regional discovery reservoir (Hub + OSM)
        if: steps.plan.outputs.selected_count != '0'
        run: |
          set -euo pipefail
          python tools/gws_source_osm.py prepare \
            --hub-snapshot results/fleet_plan/hub_brussels_current.jsonl \
            --out-candidates results/fleet_plan/gws_candidates_hub_osm.jsonl \
            --plan-dir results/fleet_plan \
            --max-age-hours 6
      - name: Add direct Overture regional discovery
        if: steps.plan.outputs.selected_count != '0'
        run: |
          set -euo pipefail
          python tools/gws_source_overture.py prepare \
            --input-candidates results/fleet_plan/gws_candidates_hub_osm.jsonl \
            --out-candidates results/fleet_plan/gws_candidates_current.jsonl \
            --plan-dir results/fleet_plan \
            --threads 16
      - name: Upload one-day plan transport
        if: steps.plan.outputs.selected_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gws-fleet-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/fleet_plan/
          compression-level: 6
          retention-days: 1

  harvest:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.selected_count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install worker dependency only
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Download shared discovery reservoir and plan
        uses: actions/download-artifact@v4
        with:
          name: gws-fleet-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/fleet_plan
      - name: Run provider-neutral GWS shard
        env:
          TASK_ID: ${{ matrix.task_id }}
          WORKLOAD_ID: ${{ matrix.workload_id }}
          TERRITORY: ${{ matrix.territory }}
          POSTAL_CODES_JSON: ${{ matrix.postal_codes_json }}
          FAMILY: ${{ matrix.family }}
          KEYWORDS_JSON: ${{ matrix.keywords_json }}
          MAX_SERIOUS: ${{ matrix.max_serious }}
          LEASE_ID: ${{ matrix.lease_id }}
          LEASE_EXPIRES_AT: ${{ matrix.lease_expires_at }}
        run: |
          set -o pipefail
          out="results/shards/${LEASE_ID}"
          python -c 'import os; print("github_cpu_count=", os.cpu_count(), "duckdb_threads=16")'
          python tools/gws_fleet_worker.py \
            --task-id "$TASK_ID" \
            --workload-id "$WORKLOAD_ID" \
            --territory "$TERRITORY" \
            --postal-codes-json "$POSTAL_CODES_JSON" \
            --family "$FAMILY" \
            --keywords-json "$KEYWORDS_JSON" \
            --max-serious "$MAX_SERIOUS" \
            --lease-id "$LEASE_ID" \
            --lease-expires-at "$LEASE_EXPIRES_AT" \
            --hub-snapshot results/fleet_plan/gws_candidates_current.jsonl \
            --outdir "$out" \
            --threads 16
          python tools/gws_worker_postprocess.py --shard-dir "$out"
      - name: Upload one-day shard transport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gws-fleet-shard-${{ matrix.lease_id }}
          path: results/shards/${{ matrix.lease_id }}/
          compression-level: 6
          retention-days: 1

  aggregate:
    needs: [plan, harvest]
    if: always() && needs.plan.outputs.enabled == 'true' && needs.plan.outputs.selected_count != '0'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh durable state base before aggregation
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
      - name: Install aggregate dependency
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Download plan/source snapshot
        uses: actions/download-artifact@v4
        with:
          name: gws-fleet-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/fleet_plan
      - name: Download all shard transports
        uses: actions/download-artifact@v4
        with:
          pattern: gws-fleet-shard-*
          path: results/shards
      - name: Persist regional discovery source state
        run: |
          python tools/gws_source_osm.py persist --plan-dir results/fleet_plan
          python tools/gws_source_overture.py persist --plan-dir results/fleet_plan
      - name: Single-writer dedupe, checkpoint and GPT handoff
        run: python tools/gws_fleet_aggregate.py --provider github --plan-dir results/fleet_plan --shards-root results/shards
      - name: Persist durable GWS state and useful observations
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "evergreen-gws-fleet"
          git config user.email "actions@users.noreply.github.com"
          git add \
            state/gws_coverage.json \
            state/gws_entity_index.json \
            state/gws_source_state.json \
            state/gws_source_profiles.json \
            state/provider_capacity.json \
            metrics/gws_latest.json \
            metrics/gws_history.jsonl \
            gpt/gws_latest_summary.json \
            gpt/gws_pending_batches.json \
            gpt/gws_review/ \
            data/gws/
          if git diff --cached --quiet; then
            echo "No durable GWS delta."
            exit 0
          fi
          git commit -m "[fleet-state] GWS autonomous checkpoint ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "Concurrent durable-state conflict; refusing unsafe merge." >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to persist GWS fleet state after retries" >&2
          exit 1

  release_capacity_lease:
    needs: [plan, harvest, aggregate]
    if: always()
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release account-wide GitHub capacity lease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python tools/global_capacity_broker.py release --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY"
