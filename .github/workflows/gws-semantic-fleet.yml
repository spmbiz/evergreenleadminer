name: GWS Qwen Semantic Fleet

on:
  workflow_run:
    workflows: ["GWS Pending Search Verify Fleet"]
    types: [completed]
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [gws_semantic_refill]

permissions:
  contents: write
  actions: read

concurrency:
  group: gws-qwen-semantic-fleet
  cancel-in-progress: false

env:
  SEMANTIC_CONFIG: config/gws_semantic_v1.json

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.prepare.outputs.stage }}
      selected: ${{ steps.prepare.outputs.selected }}
      desired_workers: ${{ steps.prepare.outputs.desired_workers }}
      workers: ${{ steps.final.outputs.workers }}
      matrix: ${{ steps.final.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize residential evidence as shadow-only semantic inputs
        run: python tools/gws_residential_semantic_adapter.py --out data/gws/verification/residential_shadow_input.jsonl
      - id: prepare
        name: Build incremental semantic queue
        run: python tools/gws_semantic_plan.py prepare --config "$SEMANTIC_CONFIG" --outdir results/gws_semantic_plan
      - name: Reserve fair-share GWS semantic capacity
        if: steps.prepare.outputs.selected != '0'
        env:
          RUN_ID: ${{ github.run_id }}
          DEMAND: ${{ steps.prepare.outputs.selected }}
          REQUESTED: ${{ steps.prepare.outputs.desired_workers }}
        run: |
          set -euo pipefail
          python tools/gws_semantic_capacity.py \
            --demand "$DEMAND" --requested "$REQUESTED" --run-id "$RUN_ID" \
            --owner "$GITHUB_REPOSITORY_OWNER" --repo "$GITHUB_REPOSITORY" \
            --out results/gws_semantic_plan/broker.json
      - name: Ensure zero broker result for empty queue
        if: steps.prepare.outputs.selected == '0'
        run: echo '{"allocated":0}' > results/gws_semantic_plan/broker.json
      - id: final
        name: Finalize matrix from allocated capacity
        run: |
          CAP=$(python -c 'import json; print(int(json.load(open("results/gws_semantic_plan/broker.json")).get("allocated") or 0))')
          python tools/gws_semantic_plan.py finalize --outdir results/gws_semantic_plan --capacity "$CAP"
      - uses: actions/upload-artifact@v4
        if: steps.final.outputs.workers != '0'
        with:
          name: gws-semantic-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/gws_semantic_plan/
          retention-days: 1
          compression-level: 6

  prepare_model:
    needs: plan
    if: needs.plan.outputs.workers != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: model
        name: Read pinned Qwen config
        run: python -c "import json; q=json.load(open('config/gws_semantic_v1.json'))['qwen']; print('repo='+q['model_repo']); print('revision='+q['model_revision']); print('file='+q['model_file'])" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ steps.model.outputs.revision }}
      - name: Download pinned official GGUF if cache missing
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          MODEL_REPO: ${{ steps.model.outputs.repo }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
          mkdir -p model_cache
          python -c "import os; from huggingface_hub import hf_hub_download; hf_hub_download(repo_id=os.environ['MODEL_REPO'], filename=os.environ['MODEL_FILE'], revision=os.environ['MODEL_REVISION'], local_dir='model_cache')"
          test -s "model_cache/$MODEL_FILE"
      - name: Validate model size
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: python -c "from pathlib import Path; import os; p=Path('model_cache')/os.environ['MODEL_FILE']; size=p.stat().st_size; assert size>1000000000, size; print({'model':str(p),'bytes':size})"

  classify:
    needs: [plan, prepare_model]
    if: needs.plan.outputs.workers != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.workers) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check requests duckdb 'ddgs>=9,<10' aiohttp 'huggingface_hub>=0.34,<2'
      - id: model
        name: Read worker model config
        run: python -c "import json; q=json.load(open('config/gws_semantic_v1.json'))['qwen']; print('repo='+q['model_repo']); print('revision='+q['model_revision']); print('file='+q['model_file']); print('image='+q['llama_cpp_image'])" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: model_cache
          key: qwen3-4b-q4km-${{ steps.model.outputs.revision }}
      - name: Recover model cache if necessary
        env:
          MODEL_REPO: ${{ steps.model.outputs.repo }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -euo pipefail
          if [ ! -s "model_cache/$MODEL_FILE" ]; then
            mkdir -p model_cache
            python -c "import os; from huggingface_hub import hf_hub_download; hf_hub_download(repo_id=os.environ['MODEL_REPO'], filename=os.environ['MODEL_FILE'], revision=os.environ['MODEL_REVISION'], local_dir='model_cache')"
          fi
          test -s "model_cache/$MODEL_FILE"
      - uses: actions/download-artifact@v4
        with:
          name: gws-semantic-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/gws_semantic_plan
      - name: Start hosted OpenSERP for targeted candidate discovery
        shell: bash
        run: |
          set +e
          if bash tools/start_openserp_ci.sh; then
            echo 'OPENSERP_URL=http://127.0.0.1:7000' >> "$GITHUB_ENV"
            echo 'SEMANTIC_SEARCH_RUNTIME=openserp_ci' >> "$GITHUB_ENV"
          else
            echo 'OPENSERP_URL=' >> "$GITHUB_ENV"
            echo 'SEMANTIC_SEARCH_RUNTIME=fallback_search_fabric' >> "$GITHUB_ENV"
            echo 'OpenSERP unavailable; candidate discovery may use fallback search only. No fallback absence can certify HIGH.'
          fi
          exit 0
      - name: Start local Qwen 4B server fail-open
        env:
          LLAMA_CPP_IMAGE: ${{ steps.model.outputs.image }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: |
          set +e
          if bash tools/start_qwen4b_ci.sh "$PWD/model_cache" "$MODEL_FILE"; then
            echo 'QWEN_URL=http://127.0.0.1:8080' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=ready' >> "$GITHUB_ENV"
          else
            echo 'QWEN_URL=http://127.0.0.1:65534' >> "$GITHUB_ENV"
            echo 'QWEN_RUNTIME=unavailable' >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Targeted web discovery then Qwen semantic compare
        run: |
          out="results/gws_semantic_workers/${{ matrix.worker_index }}"
          python tools/gws_semantic_worker.py \
            --input "results/gws_semantic_plan/${{ matrix.path }}" \
            --config "$SEMANTIC_CONFIG" --qwen-url "$QWEN_URL" \
            --worker-index "${{ matrix.worker_index }}" --outdir "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gws-semantic-worker-${{ github.run_id }}-${{ matrix.worker_index }}
          path: results/gws_semantic_workers/${{ matrix.worker_index }}/
          retention-days: 2
          compression-level: 6

  aggregate:
    needs: [plan, classify]
    if: always() && needs.plan.outputs.workers != '0'
    concurrency:
      group: gws-semantic-ledger-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh durable state base
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/download-artifact@v4
        with:
          name: gws-semantic-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/gws_semantic_plan
      - uses: actions/download-artifact@v4
        with:
          pattern: gws-semantic-worker-${{ github.run_id }}-*
          path: results/gws_semantic_workers
      - name: Aggregate shadow classifications and rollout gate
        run: python tools/gws_semantic_aggregate.py --root results/gws_semantic_workers --plan results/gws_semantic_plan/plan.json --config "$SEMANTIC_CONFIG"
      - name: Persist semantic ledger, metrics and GPT handoff
        run: |
          set -euo pipefail
          git config user.name 'evergreen-gws-semantic'
          git config user.email 'actions@users.noreply.github.com'
          git add state/gws_semantic_index.json state/gws_semantic_rollout.json data/gws/semantic/ gpt/gws_semantic_review/ metrics/gws_semantic_latest.json metrics/gws_semantic_history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "[gws-semantic-state] Qwen shadow checkpoint ${GITHUB_RUN_ID} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort >/dev/null 2>&1 || true; exit 1; fi
              sleep $((attempt * 3))
            done
          fi

  release_capacity:
    needs: [plan, classify, aggregate]
    if: always()
    concurrency:
      group: ai-prod-global-capacity-broker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release global GWS capacity lease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python tools/global_capacity_broker.py release --run-id "$RUN_ID" --repo "$GITHUB_REPOSITORY"
