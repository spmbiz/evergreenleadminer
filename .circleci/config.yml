version: 2.1

jobs:
  push_probe:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Test whether CircleCI checkout credentials can persist to GitHub
          command: |
            set -euo pipefail
            git config user.name "circleci-fleet-bot"
            git config user.email "circleci@users.noreply.github.com"
            mkdir -p state
            printf '{"circleci_push_probe":"ok","workflow":"%s"}\n' "$CIRCLE_WORKFLOW_ID" > state/circleci_push_probe.json
            git add state/circleci_push_probe.json
            git commit -m "[ci skip] CircleCI persistence capability probe"
            git push origin HEAD:refs/heads/circleci-persistence-probe

workflows:
  push_probe_workflow:
    jobs:
      - push_probe
