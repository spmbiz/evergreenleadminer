version: 2.1

jobs:
  four_way:
    parallelism: 4
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Parallel node smoke
          command: |
            set -e
            echo "node=${CIRCLE_NODE_INDEX} total=${CIRCLE_NODE_TOTAL}"
            python --version

workflows:
  four_way_stress:
    jobs:
      - four_way
