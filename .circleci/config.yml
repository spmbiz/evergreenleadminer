version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  dynamic_smoke:
    executor: continuation/default
    steps:
      - checkout
      - run:
          name: Build tiny continuation config
          command: |
            cat > /tmp/continue.yml <<'EOF'
            version: 2.1
            jobs:
              continued:
                docker:
                  - image: cimg/base:stable
                steps:
                  - run: echo "dynamic_continuation=ok"
            workflows:
              continued_workflow:
                jobs:
                  - continued
            EOF
      - continuation/continue:
          configuration_path: /tmp/continue.yml

workflows:
  dynamic_smoke_workflow:
    jobs:
      - dynamic_smoke
