version: 2.1

jobs:
  smoke:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify CircleCI runner and repo checkout
          command: |
            set -euo pipefail
            python --version
            test -f tools/hospitality_worker.py
            echo "circleci_smoke=ok"

workflows:
  circleci_smoke:
    jobs:
      - smoke
