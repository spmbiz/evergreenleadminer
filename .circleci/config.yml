version: 2.1

commands:
  run_hospitality_shard:
    parameters:
      offset:
        type: integer
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: python -m pip install --disable-pip-version-check duckdb requests
      - run:
          name: Harvest one deterministic real shard
          command: |
            set -euo pipefail
            export GLOBAL_INDEX=$((CIRCLE_NODE_INDEX + << parameters.offset >>))
            mkdir -p results/fleet_plan "results/shards/node-${GLOBAL_INDEX}"
            python tools/circleci_stress_plan.py --capacity 30 --local-workers 64 --out results/fleet_plan/plan.json
            python -c "import json,os; p=json.load(open('results/fleet_plan/plan.json')); i=int(os.environ['GLOBAL_INDEX']); assert len(p['include']) > i, (len(p['include']),i)"
            python tools/circleci_hospitality_worker.py --plan-json results/fleet_plan/plan.json --task-index "$GLOBAL_INDEX" --verify-engine thread --local-workers 64 --outdir "results/shards/node-${GLOBAL_INDEX}"

jobs:
  harvest_a:
    parallelism: 15
    docker:
      - image: cimg/python:3.11
    steps:
      - run_hospitality_shard:
          offset: 0

  harvest_b:
    parallelism: 15
    docker:
      - image: cimg/python:3.11
    steps:
      - run_hospitality_shard:
          offset: 15

workflows:
  circleci_hospitality_30:
    jobs:
      - harvest_a
      - harvest_b
