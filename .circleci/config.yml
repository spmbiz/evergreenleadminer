version: 2.1

jobs:
  token_probe:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Verify GitHub persistence token exists
          command: |
            set -euo pipefail
            test -n "${FLEET_GH_TOKEN:-}" || { echo "FLEET_GH_TOKEN missing" >&2; exit 42; }
            echo "token_present=yes"

workflows:
  token_probe_workflow:
    jobs:
      - token_probe
